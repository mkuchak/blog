name: Release and deploy

# Every push to main:
#   1. semantic-release reads the Conventional Commits since the last tag. feat, fix, perf and revert
#      (and any BREAKING CHANGE) cut a versioned GitHub release; other types (chore, docs, style, ci…) don't.
#   2. The site deploys when a release was cut OR anything under site/posts/ changed (any commit type),
#      or when the workflow is run by hand.
# Deploying = build (site/build.py) + pre-render (site/prerender.mjs) + check (site/check.py --strict)
# + push dist/ to the `production` branch, which Cloudflare Pages (project kuch-dev) serves as-is,
# then wait until https://kuch.dev/version.json reports this commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: semrel
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25
          extra_plugins: |
            conventional-changelog-conventionalcommits@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      posts: ${{ steps.filter.outputs.posts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.before }}
          filters: |
            posts:
              - 'site/posts/**'

  deploy:
    needs: [release, changes]
    if: needs.release.outputs.published == 'true' || needs.changes.outputs.posts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kuch.dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: python3 site/build.py
      - name: Pre-render for SEO
        run: node site/prerender.mjs
      - name: Check
        run: python3 site/check.py --strict
      - name: Stamp version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          [ -z "$VERSION" ] && VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          printf '{"version":"%s","commit":"%s","builtAt":"%s"}\n' "${VERSION:-0.0.0}" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/version.json
          echo "VERSION=${VERSION:-0.0.0}" >> "$GITHUB_ENV"
      - name: Publish to the production branch (Cloudflare Pages deploys it)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: production
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "deploy: v${{ env.VERSION }} (${{ github.sha }})"
      - name: Wait until kuch.dev serves this commit
        run: |
          for i in $(seq 1 60); do
            got="$(curl -fsS "https://kuch.dev/version.json?t=$(date +%s)" | python3 -c 'import sys,json; print(json.load(sys.stdin)["commit"])' || true)"
            if [ "$got" = "$GITHUB_SHA" ]; then echo "kuch.dev is on v$VERSION ($GITHUB_SHA)"; exit 0; fi
            sleep 10
          done
          echo "::error::kuch.dev still serves ${got:-nothing} after 10 minutes"; exit 1
      - name: Smoke test
        run: |
          for path in / /pt-BR/ /blog/ /pt-BR/blog/ /feed.xml /sitemap.xml; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://kuch.dev$path")"
            echo "$code $path"; [ "$code" = "200" ] || exit 1
          done
          for slug in $(python3 -c 'import json; print(" ".join(p["slug"] for p in json.load(open("dist/posts/index.json"))))'); do
            for prefix in "" "/pt-BR"; do
              code="$(curl -s -o /dev/null -w '%{http_code}' "https://kuch.dev$prefix/blog/$slug/")"
              echo "$code $prefix/blog/$slug/"; [ "$code" = "200" ] || exit 1
            done
          done
