      .pgrid { display: grid; grid-template-columns: 220px minmax(0, 46rem) 1fr; gap: 64px; padding: 48px 0 0; }

      /* prose */

      .prose pre { margin: 0; padding: 18px 20px 20px; overflow-x: auto; tab-size: 2; }

      .prose .table-wrap { overflow-x: auto; margin: 1.8em 0; border: 1px solid var(--line); border-radius: 14px; }

      .prose th { text-align: left; font-weight: 700; background: var(--paper); }

      .prose details { margin: 1.8em 0; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
      .prose details > summary {
        cursor: pointer; list-style: none; padding: 14px 18px; font: 600 0.92rem var(--sans); display: flex; align-items: center; gap: 10px;
      }
      .prose details > summary::-webkit-details-marker { display: none; }
      .prose details > summary::before { content: "+"; font: 600 1rem/1 var(--mono); width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--y); color: #1b202b; transition: transform 0.3s var(--ease); flex: none; }

      /* highlight.js tokens from the palette */
      .hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword, .hljs-doctag { color: var(--tk-kw); }
      .hljs-type, .hljs-built_in, .hljs-class .hljs-title, .hljs-title.class_ { color: var(--tk-type); }
      .hljs-string, .hljs-regexp, .hljs-template-tag, .hljs-subst { color: var(--tk-str); }
      .hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: var(--tk-num); }

      .hljs-comment, .hljs-quote { color: var(--tk-com); font-style: italic; }

      /* end of article */
      .pend { grid-column: 2; display: flex; flex-direction: column; gap: 44px; margin-top: 56px; }
      .share { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 0; border-top: 2px solid var(--fg); border-bottom: 1px solid var(--line); }

      .dark .pn span.tp { color: var(--y); }
      .author { display: grid; grid-template-columns: 96px 1fr; gap: 24px; align-items: center; padding: 28px; border-radius: 22px; background: var(--paper); border: 1px solid var(--line); }
      .author img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--y); }
      .author .hello { font-size: 1.7rem; margin-bottom: 4px; }
      .author .rl { font: 600 0.72rem/1.6 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); margin: 4px 0 10px; }
      .author .rl mark { background: var(--hl); color: var(--fg); padding: 0 2px; }
      .author p { font-family: var(--serif); font-size: 1rem; line-height: 1.65; color: var(--muted); margin: 0 0 14px; }
      .author .links { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 500 0.85rem var(--mono); }
      .author .links a { text-decoration: none; color: var(--fg); }
      .author .links a:hover { color: var(--link); }
      .backall { font: 500 0.9rem var(--mono); text-decoration: none; color: var(--muted); }
      .backall:hover { color: var(--fg); }

      .nf { padding: 96px 0 120px; }
      .nf .big { font: 900 clamp(5rem, 16vw, 11rem)/0.85 var(--sans); letter-spacing: -0.06em; margin: 0; color: var(--fg); }
      .nf .msg { font-family: var(--serif); font-size: 1.3rem; color: var(--muted); line-height: 1.6; margin: 18px 0 28px; max-width: 30em; }

      .loading { padding: 120px 0; font: 500 0.85rem var(--mono); color: var(--soft); }

      footer.foot { border-top: 1px solid var(--line); margin-top: 110px; }
      footer.foot .wrap { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 30px 0; flex-wrap: wrap; }
      footer .small { font-size: 0.85rem; color: var(--soft); }
      footer .small b { color: var(--fg); }
      footer .set { font-family: var(--serif); font-style: italic; font-size: 0.82rem; color: var(--soft); }
      .dark .mast nav a:hover { color: var(--accent); }
      .dark .prose a:hover { color: var(--accent); }

      /* ---------- responsive ---------- */
      @media (max-width: 1180px) {
        .mast nav a { display: none; }

      }
      @media (max-width: 1024px) {
        .row { grid-template-columns: 120px 1fr 180px; gap: 26px; }
        .featured { grid-template-columns: 1fr; gap: 32px; }
      }
      @media (max-width: 920px) {
        .pgrid { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 32px; }
        .otp { display: none; }

        .mtoc { display: block; margin: 0 0 36px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
        .mtoc summary { cursor: pointer; list-style: none; padding: 14px 18px; font: 600 0.74rem var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); display: flex; justify-content: space-between; }
        .mtoc summary::-webkit-details-marker { display: none; }
        .mtoc summary::after { content: "+"; color: var(--fg); }
        .mtoc[open] summary::after { content: "−"; }
        .mtoc ol { list-style: none; margin: 0; padding: 0 18px 14px; }
        .mtoc li a { display: block; padding: 8px 0; text-decoration: none; font-size: 0.95rem; line-height: 1.4; color: var(--muted); border-top: 1px solid var(--line); }

      }
      @media (max-width: 760px) {
        .row { grid-template-columns: 1fr; gap: 12px; }

        .byline .tags { margin-left: 0; width: 100%; }

        .mast .pill.resume { padding: 0; width: 32px; height: 32px; justify-content: center; }
        .mast .pill.resume .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
        .prose { font-size: 1.08rem; line-height: 1.75; }
        .prose pre { padding: 14px 16px 16px; }
        .prose pre code { font-size: 0.8rem; }
        .pcover img { border-radius: 16px; aspect-ratio: 16 / 10; }
        .phead { padding-top: 28px; }
        .crumbs { margin-bottom: 26px; }
        .search { max-width: none; }
        .search kbd { display: none; }
        .aura i:nth-child(1) { width: 340px; height: 340px; }
        .aura i:nth-child(2) { width: 300px; height: 300px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }

  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app"></div>

    <script>
      (function () {
        const c = KUCH.content();
        const m = KUCH.meta;
        const B = KUCH_BLOG;
        const t = B.t;
        const pt = KUCH.lang === "pt";
        const root = document.documentElement;
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce) root.classList.add("motion");

        const d = pt
          ? { vol: "Vol.", day: "Edição diurna", night: "Edição noturna", by: "por", notes: "Notas", set: "Composto em Inter, Noto Serif, Yellowtail e JetBrains Mono.", issue: "Edição", filtered: "Filtrando por", search: "Resultados para", clear: "Limpar", posts: "posts", post: "post", lost: "Página perdida", aboutMe: "Sobre mim", email: "Email", followRss: "Assinar via RSS", latestIn: "Mais recente", wordsShort: "palavras", readNext: "Continue lendo", nextIssue: "Próximas edições", more: "mais", less: "Mostrar menos", shareX: "Postar no X", shareLi: "LinkedIn" }
          : { vol: "Vol.", day: "Day edition", night: "Night edition", by: "by", notes: "Notes", set: "Set in Inter, Noto Serif, Yellowtail and JetBrains Mono.", issue: "Issue", filtered: "Filtered by", search: "Results for", clear: "Clear", posts: "posts", post: "post", lost: "Lost page", aboutMe: "About me", email: "Email", followRss: "Follow via RSS", latestIn: "Latest", wordsShort: "words", readNext: "Keep reading", nextIssue: "Next issues", more: "more", less: "Show less", shareX: "Post on X", shareLi: "LinkedIn" };

        const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
        const year = new Date().getFullYear();
        const edition = () => (root.classList.contains("dark") ? d.night : d.day);

        // Keep ?lang / ?theme on internal links when they came in the URL.
        const carry = (href) => {
          const cur = new URLSearchParams(location.search);
          const [path, hash] = href.split("#");
          const u = new URL(path, location.href);
          ["lang", "theme"].forEach((k) => cur.get(k) && !u.searchParams.has(k) && u.searchParams.set(k, cur.get(k)));
          return u.pathname + u.search + (hash ? "#" + hash : "");
        };
        const landing = (hash) => carry("/v/b/" + (hash ? "#" + hash : ""));
        const postHref = (slug) => carry(B.postUrl(slug));
        const tagHref = (tag) => carry(B.tagUrl(tag));
        const indexHref = () => carry(B.indexUrl());

        const RSS = `<svg class="rss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.4" fill="currentColor"/></svg>`;
        const SEARCH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;

        // ---------- frame ----------
        const app = document.getElementById("app");
        app.innerHTML = `
          <div class="wrap topline" aria-hidden="true">
            <span>${d.vol} ${c.stats[0].value} · ${esc(c.about.based)}</span>
            <span>${esc(m.domain)}<span class="nt"> / ${d.notes.toLowerCase()}</span></span>
            <span><span id="edition">${edition()}</span> · ${year}</span>
          </div>
          <header class="mast">
            <div class="wrap">
              <a class="brand" href="${landing()}" aria-label="${esc(m.name)}">Kuchak<i>.</i></a>
              <nav aria-label="Primary">
                <a href="${landing("principles")}">${esc(c.nav.principles)}</a>
                <a href="${landing("work")}">${esc(c.nav.work)}</a>
                <a href="${landing("journey")}">${esc(c.nav.journey)}</a>
                <a href="${landing("oss")}">${esc(c.nav.oss)}</a>
                <a href="${indexHref()}" aria-current="page">${esc(c.nav.writing)}</a>
              </nav>
              <div class="tools">
                <div id="prefs"></div>
                <a class="pill solid resume" href="${m.links.resume}" target="_blank" rel="noreferrer" title="${esc(c.nav.resume)}"><span class="lbl">${esc(c.nav.resume)}</span> <span class="arr">↗</span></a>
              </div>
            </div>
            <span class="progress" aria-hidden="true"></span>
          </header>
          <main id="main" tabindex="-1"><div class="wrap loading">…</div></main>
          <footer class="foot">
            <div class="wrap">
              <a class="brand" href="${landing()}">Kuchak<i>.</i></a>
              <span class="small">© ${year} <b>${esc(m.domain)}</b>. ${esc(c.contact.footer)}</span>
              <span class="set">${d.set}</span>
              <a class="pill ghost" href="#top" id="toTop">${esc(c.ui.backToTop)} ↑</a>
            </div>
          </footer>`;
        KUCH_PREFS.mount(document.getElementById("prefs"));
        document.getElementById("toTop").addEventListener("click", (e) => { e.preventDefault(); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); });
        addEventListener("kuch:theme", () => { const e = document.getElementById("edition"); if (e) e.textContent = edition(); });

        const main = document.getElementById("main");
        const progress = document.querySelector(".progress");
        const setMeta = (title, desc) => {
          document.title = title;
          document.querySelector('meta[name="description"]').setAttribute("content", desc);
        };

        // Reveal on scroll.
        const io = new IntersectionObserver(
          (entries) => entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
          { threshold: 0.12, rootMargin: "0px 0px -4% 0px" }
        );
        const reveal = () => main.querySelectorAll(".rv:not(.in)").forEach((el) => io.observe(el));

        // Page progress: post view tracks the article, index tracks the page.
        let progressTarget = null;
        function onScroll() {
          let p;
          if (progressTarget) {
            const r = progressTarget.getBoundingClientRect();
            const total = r.height - innerHeight * 0.6;
            p = total > 0 ? Math.min(1, Math.max(0, (-r.top + 96) / total)) : 0;
          } else {
            const max = document.documentElement.scrollHeight - innerHeight;
            p = max > 0 ? scrollY / max : 0;
          }
          progress.style.transform = `scaleX(${p})`;
        }
        addEventListener("scroll", onScroll, { passive: true });
        addEventListener("resize", onScroll);

        const tagsHtml = (tags, cls = "tag") => tags.map((tg) => `<a class="${cls}" href="${tagHref(tg)}" data-tag="${esc(tg)}">${esc(tg)}</a>`).join("");
        const metaHtml = (e) =>
          `<div class="meta"><time datetime="${esc(e.date)}">${esc(B.formatDate(e.date))}</time><span class="sep">·</span><span>${e.readingMinutes} ${esc(t.minRead)}</span></div>`;

        // ---------- router ----------
        let lastSearch = null;
        function route() {
          lastSearch = location.search;
          const p = B.query();
          const slug = p.get("post");
          progressTarget = null;
          if (slug) renderPost(slug);
          else renderIndex(p.get("tag") || "", p.get("q") || "");
        }

        // ---------- index ----------
        let entries = null;
        const TAGS_SHOWN = 7;
        async function renderIndex(tag, q) {
          setMeta(`${t.blog} · ${m.name}`, t.blogSub);
          try {
            entries = entries || (await B.list());
          } catch (err) {
            main.innerHTML = indexShell(0) + `<div class="wrap empty"><span class="hello">${esc(t.blog)}</span><span>${esc(t.offline)}</span></div>`;
            return;
          }
          const allTags = new Map();
          entries.forEach((e) => e.tags.forEach((tg) => allTags.set(tg, (allTags.get(tg) || 0) + 1)));
          const tagList = [...allTags.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          const upcoming = (window.KUCH_DRAFTS || c.writing.filter((w) => !w.published));

          main.innerHTML = `
            ${indexShell(entries.length)}
            <section class="wrap" id="featuredWrap"></section>
            <section class="wrap" aria-labelledby="allTitle">
              <div class="toolbar">
                <div class="top">
                  <h2 id="allTitle">${esc(t.allPosts)}<span class="count" id="count"></span></h2>
                  <label class="search">
                    <span class="vh">${esc(t.search)}</span>
                    ${SEARCH}
                    <input id="q" type="search" placeholder="${esc(t.search)}" autocomplete="off" value="${esc(q)}" />
                    <kbd>/</kbd>
                  </label>
                </div>
                <div class="chips" role="group" aria-label="${esc(t.tags)}">
                  <button class="tag" type="button" data-filter="" aria-pressed="${!tag}">${esc(t.all)} <span class="n">${entries.length}</span></button>
                  ${tagList.map(([tg, n], i) => `<button class="tag" type="button" data-filter="${esc(tg)}" aria-pressed="${tg === tag}"${i >= TAGS_SHOWN ? " data-extra" : ""}>${esc(tg)} <span class="n">${n}</span></button>`).join("")}
                  ${tagList.length > TAGS_SHOWN ? `<button class="tag more" type="button" id="moreTags" aria-expanded="false">+${tagList.length - TAGS_SHOWN} ${esc(d.more)}</button>` : ""}
                </div>
                <div class="filter-note" id="note" hidden></div>
              </div>
              <ol class="posts" id="list"></ol>
              <div id="emptyBox"></div>
            </section>
            ${
              upcoming.length
                ? `<section class="wrap soon-wrap rv" aria-labelledby="soonTitle">
                    <div class="kick rule-top" id="soonTitle">${esc(d.nextIssue)}<b>${esc(t.comingUp)}</b></div>
                    <ol class="soonlist">${upcoming
                      .map((w) => `<li><span class="t">${esc(w.title)}</span><span class="lead2"></span><span class="pg">${esc(w.tags.join(" · "))}</span></li>`)
                      .join("")}</ol>
                  </section>`
                : ""
            }`;

          const state = { tag, q };
          const qInput = document.getElementById("q");
          const chipsEl = main.querySelector(".chips");
          const more = document.getElementById("moreTags");
          const expand = (open) => {
            chipsEl.classList.toggle("open", open);
            if (more) { more.setAttribute("aria-expanded", String(open)); more.textContent = open ? d.less : `+${tagList.length - TAGS_SHOWN} ${d.more}`; }
          };
          if (more) more.addEventListener("click", () => expand(!chipsEl.classList.contains("open")));
          if (tag && tagList.findIndex(([tg]) => tg === tag) >= TAGS_SHOWN) expand(true);

          function apply(push) {
            const needle = state.q.trim().toLowerCase();
            const list = entries.filter((e) => {
              if (state.tag && !e.tags.includes(state.tag)) return false;
              if (!needle) return true;
              return [e.title, e.description, e.topic, ...e.tags].join(" ").toLowerCase().includes(needle);
            });
            const showFeatured = !state.tag && !needle && entries.length > 0;
            const featured = showFeatured ? entries[0] : null;
            document.getElementById("featuredWrap").innerHTML = featured ? featuredHtml(featured) : "";
            const rest = featured ? list.filter((e) => e !== featured) : list;
            document.getElementById("list").innerHTML = rest.map(rowHtml).join("");
            document.getElementById("count").textContent = `${list.length} ${list.length === 1 ? d.post : d.posts}`;
            const note = document.getElementById("note");
            const bits = [];
            if (state.tag) bits.push(`${esc(d.filtered)} <span class="hl">${esc(state.tag)}</span>`);
            if (needle) bits.push(`${esc(d.search)} "${esc(state.q.trim())}"`);
            note.hidden = !bits.length;
            note.innerHTML = bits.length ? `<span>${bits.join(" · ")}</span><button type="button" id="clear">${esc(d.clear)}</button>` : "";
            const clear = document.getElementById("clear");
            if (clear) clear.addEventListener("click", () => { state.tag = ""; state.q = ""; qInput.value = ""; sync(true); });
            document.getElementById("emptyBox").innerHTML = list.length
              ? ""
              : `<div class="empty"><span class="hello">${esc(d.lost)}</span><span>${esc(t.noResults)}</span><button class="pill ghost" type="button" id="clear2">${esc(d.clear)}</button></div>`;
            const clear2 = document.getElementById("clear2");
            if (clear2) clear2.addEventListener("click", () => { state.tag = ""; state.q = ""; qInput.value = ""; sync(true); });
            main.querySelectorAll("[data-filter]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filter === state.tag)));
            setMeta(state.tag ? `${state.tag} · ${t.blog} · ${m.name}` : `${t.blog} · ${m.name}`, t.blogSub);
            reveal();
            if (push !== undefined) syncUrl(push);
          }

          function syncUrl(push) {
            const u = new URL(location.href);
            u.pathname = new URL(B.indexUrl(), location.href).pathname;
            u.searchParams.delete("post");
            state.tag ? u.searchParams.set("tag", state.tag) : u.searchParams.delete("tag");
            state.q.trim() ? u.searchParams.set("q", state.q.trim()) : u.searchParams.delete("q");
            const href = u.pathname + u.search;
            if (href === location.pathname + location.search) return;
            push ? history.pushState(null, "", href) : history.replaceState(null, "", href);
            lastSearch = location.search;
          }
          function sync(push) { apply(push); }

          main.querySelectorAll("[data-filter]").forEach((b) =>
            b.addEventListener("click", () => {
              state.tag = b.dataset.filter === state.tag ? "" : b.dataset.filter;
              sync(true);
            })
          );
          // Tag links inside rows filter in place instead of reloading.
          main.addEventListener("click", (e) => {
            const a = e.target.closest("a[data-tag]");
            if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
            e.preventDefault();
            state.tag = a.dataset.tag;
            sync(true);
            document.getElementById("allTitle").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
          });
          let qt;
          qInput.addEventListener("input", () => { state.q = qInput.value; apply(); clearTimeout(qt); qt = setTimeout(() => syncUrl(false), 300); });
          apply();
          requestAnimationFrame(() => root.classList.add("ready"));
          onScroll();
        }

        function indexShell(n) {
          return `
            <div class="lead">
              <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
              <section class="wrap bhead">
                <div class="kick rule-top">${d.issue} ${String(n).padStart(2, "0")}<b>${esc(d.notes)}</b></div>
                <div>
                  <h1><span class="hl sweep">${esc(t.blog)}</span></h1>
                  <p>${esc(t.blogSub)}</p>
                  <div class="acts">
                    <span>${d.by} <a href="${landing()}">${esc(m.name)}</a></span>
                    <a href="${B.feedUrl}">${RSS} ${esc(d.followRss)}</a>
                  </div>
                </div>
              </section>
            </div>`;
        }

        function featuredHtml(e) {
          return `
            <article class="featured rv">
              <a class="img" href="${postHref(e.slug)}" tabindex="-1" aria-hidden="true">${coverHtml(e, "eager")}</a>
              <div>
                <span class="badge">${esc(t.latest)}</span>
                <div class="kick">${esc(e.topic)}</div>
                <h2><a href="${postHref(e.slug)}"><span class="hl">${esc(e.title)}</span></a></h2>
                <p>${esc(e.description)}</p>
                ${metaHtml(e)}
                <div class="tags">${tagsHtml(e.tags)}</div>
              </div>
            </article>`;
        }

        // Posts without a cover (or with a broken one) get a typographic placeholder.
        const placeholder = (e) => `<div class="cover ph"><span>${esc(e.topic || t.blog)}</span><b>${esc(e.title || "")}</b></div>`;
        function coverHtml(e, loading) {
          return e.cover
            ? `<img class="cover" src="${esc(e.cover)}" alt="" loading="${loading}" onerror="this.outerHTML=this.dataset.ph" data-ph="${esc(placeholder(e))}" />`
            : placeholder(e);
        }

        function rowHtml(e) {
          return `
            <li class="row rv">
              <div class="when"><b>${esc(B.formatDate(e.date))}</b><span>${e.readingMinutes} ${esc(t.minRead)}</span></div>
              <div>
                <span class="topic">${esc(e.topic)}</span>
                <h3><a href="${postHref(e.slug)}"><span class="hl">${esc(e.title)}</span></a></h3>
                <p>${esc(e.description)}</p>
                <div class="tags">${tagsHtml(e.tags)}</div>
              </div>
              <div class="thumb">${coverHtml(e, "lazy")}</div>
            </li>`;
        }

        // ---------- post ----------
        async function renderPost(slug) {
          let post = null;
          try {
            post = await B.get(slug);
          } catch (err) {
            main.innerHTML = `<div class="wrap empty"><span class="hello">${esc(t.blog)}</span><span>${esc(t.offline)}</span></div>`;
            return;
          }
          if (!post) return renderNotFound();

          setMeta(`${post.title} · ${m.name}`, post.description);
          const tocItems = post.toc.map((h) => `<li class="l${h.level}"><a href="#${h.id}" data-id="${h.id}">${esc(h.text)}</a></li>`).join("");
          const url = new URL(B.postUrl(slug), location.href).href;
          const shareText = encodeURIComponent(post.title);
          const role = esc(c.hero.role).replace(/Full-Stack/i, (x) => `<mark>${x}</mark>`);

          main.innerHTML = `
            <div class="lead">
              <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
              <header class="wrap phead">
                <nav class="crumbs" aria-label="Breadcrumb">
                  <a href="${landing()}">${esc(t.home)}</a><span aria-hidden="true">/</span>
                  <a href="${indexHref()}">${esc(t.blog)}</a><span aria-hidden="true">/</span>
                  <a href="${tagHref(post.tags[0] || "")}" data-tag="${esc(post.tags[0] || "")}">${esc(post.topic)}</a>
                </nav>
                <div class="inner">
                  <span class="topic">${esc(post.topic)}</span>
                  <h1>${esc(post.title)}</h1>
                  <p class="dek">${esc(post.description)}</p>
                </div>
                <div class="byline">
                  <img src="${m.avatar}" alt="" width="40" height="40" />
                  <span class="who">${esc(m.name)}</span>
                  <div class="meta">
                    <span>${esc(t.published)} <time datetime="${esc(post.date)}">${esc(B.formatDate(post.date))}</time></span>
                    ${post.updated ? `<span class="sep">·</span><span>${esc(t.updated)} ${esc(B.formatDate(post.updated))}</span>` : ""}
                    <span class="sep">·</span><span>${post.readingMinutes} ${esc(t.minRead)}</span>
                    <span class="sep">·</span><span>${post.words.toLocaleString(pt ? "pt-BR" : "en-US")} ${esc(d.wordsShort)}</span>
                  </div>
                  <div class="tags">${post.tags.map((tg) => `<a class="tag" href="${tagHref(tg)}">${esc(tg)}</a>`).join("")}</div>
                </div>
                ${post.untranslated ? `<p class="notice" lang="pt-BR">${esc(t.onlyEnglish)}</p>` : ""}
                ${post.cover ? `<figure class="pcover"><img src="${esc(post.cover)}" alt="" /></figure>` : ""}
              </header>
            </div>
            <div class="wrap pgrid">
              ${
                post.toc.length
                  ? `<aside class="otp" aria-label="${esc(t.onThisPage)}"><h2>${esc(t.onThisPage)}</h2><ol>${tocItems}</ol><div class="rt">${post.readingMinutes} ${esc(t.minRead)}</div></aside>`
                  : "<div></div>"
              }
              <div>
                ${post.toc.length ? `<details class="mtoc"><summary>${esc(t.onThisPage)}</summary><ol>${tocItems}</ol></details>` : ""}
                <article class="prose" id="article" lang="${post.lang === "pt" ? "pt-BR" : "en"}">${post.html}</article>
              </div>
              <div class="pend">
                <div class="share">
                  <span class="lbl">${esc(t.share)}</span>
                  <button class="tag" type="button" id="copyLink">${esc(t.copyLink)}</button>
                  <a class="tag" href="https://x.com/intent/post?text=${shareText}&url=${encodeURIComponent(url)}" target="_blank" rel="noopener noreferrer">X ↗</a>
                  <a class="tag" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
                  <a class="tag gh" href="${B.editUrl(slug)}" target="_blank" rel="noopener noreferrer">${esc(t.edit)} ↗</a>
                </div>
                ${
                  post.prev || post.next
                    ? `<nav class="pn" aria-label="${esc(d.readNext)}">
                        ${post.prev ? `<a class="prev" href="${postHref(post.prev.slug)}"><small>← ${esc(t.prev)}</small><span class="tp">${esc(post.prev.topic)}</span><b>${esc(post.prev.title)}</b></a>` : ""}
                        ${post.next ? `<a class="next" href="${postHref(post.next.slug)}"><small>${esc(t.next)} →</small><span class="tp">${esc(post.next.topic)}</span><b>${esc(post.next.title)}</b></a>` : ""}
                      </nav>`
                    : ""
                }
                <aside class="author">
                  <img src="${m.avatar}" alt="${esc(m.name)}" width="96" height="96" />
                  <div>
                    <span class="hello">${esc(c.hero.hello)}</span>
                    <div class="rl">${role}</div>
                    <p>${esc(c.hero.headline)} ${esc(c.contact.sub)}</p>
                    <div class="links">
                      <a href="${landing()}">${esc(d.aboutMe)} →</a>
                      <a href="mailto:${m.email}">${esc(m.email)}</a>
                      <a href="${m.links.github}" target="_blank" rel="noreferrer">GitHub ↗</a>
                      <a href="${m.links.linkedin}" target="_blank" rel="noreferrer">LinkedIn ↗</a>
                    </div>
                  </div>
                </aside>
                <a class="backall" href="${indexHref()}">← ${esc(t.back)}</a>
              </div>
            </div>`;

          const article = document.getElementById("article");
          B.enhance(article);
          progressTarget = article;
          // TOC labels from the rendered headings, so inline code like ClassProps<T, U> keeps its text.
          const labelOf = (id) => {
            const h = document.getElementById(id);
            if (!h) return null;
            const cl = h.cloneNode(true);
            cl.querySelectorAll(".anchor").forEach((a) => a.remove());
            return cl.textContent.trim();
          };
          main.querySelectorAll(".otp a[data-id], .mtoc a[data-id]").forEach((a) => {
            const txt = labelOf(a.dataset.id);
            if (txt) a.textContent = txt;
          });

          document.getElementById("copyLink").addEventListener("click", async (e) => {
            try { await navigator.clipboard.writeText(url); } catch {}
            e.currentTarget.textContent = t.copied;
            setTimeout(() => (e.currentTarget && (e.currentTarget.textContent = t.copyLink)), 1400);
          });

          // Scroll-spy for the table of contents.
          const links = [...main.querySelectorAll(".otp a[data-id]")];
          const heads = post.toc.map((h) => document.getElementById(h.id)).filter(Boolean);
          if (links.length && heads.length) {
            const setOn = (id) => links.forEach((a) => a.classList.toggle("on", a.dataset.id === id));
            const spy = () => {
              let cur = heads[0].id;
              for (const h of heads) if (h.getBoundingClientRect().top < 140) cur = h.id;
              setOn(cur);
            };
            addEventListener("scroll", spy, { passive: true });
            spy();
          }
          main.querySelectorAll(".mtoc a").forEach((a) => a.addEventListener("click", () => a.closest("details").removeAttribute("open")));

          // Deep links to a heading after async render.
          if (location.hash) {
            const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
            if (target) requestAnimationFrame(() => target.scrollIntoView());
          }
          requestAnimationFrame(() => root.classList.add("ready"));
          onScroll();
        }

        function renderNotFound() {
          setMeta(`404 · ${t.blog} · ${m.name}`, t.notFound);
          main.innerHTML = `
            <div class="lead">
              <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
              <section class="wrap nf">
                <span class="hello" style="font-size:2.4rem">${esc(d.lost)}</span>
                <p class="big">404</p>
                <p class="msg">${esc(t.notFound)}</p>
                <a class="pill solid" href="${indexHref()}">← ${esc(t.allPosts)}</a>
              </section>
            </div>`;
        }

        // "/" focuses the search box on the index.
        addEventListener("keydown", (e) => {
          if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
          const tg = e.target;
          if (tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.isContentEditable)) return;
          const q = document.getElementById("q");
          if (q) { e.preventDefault(); q.focus(); }
        });

        // Back/forward between views re-renders; hash-only changes (TOC jumps) just scroll.
        addEventListener("popstate", () => {
          if (location.search === lastSearch) return;
          scrollTo(0, 0);
          route();
        });
        route();
      })();
    </script>
  </body>
</html>
