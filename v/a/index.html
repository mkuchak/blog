      .stats { border-block: 1px solid var(--line); background: var(--bg-soft); }
      .stats .wrap { display: grid; grid-template-columns: repeat(6, 1fr); }
      .stat { padding: 34px 22px; border-left: 1px solid var(--line); }
      .stat:first-child { border-left: 0; padding-left: 0; }
      .stat .n { font-size: clamp(2rem, 3.2vw, 2.8rem); font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
      .stat .n em { font-style: normal; color: var(--yellow-ink); }
      .stat .l { margin-top: 12px; font-weight: 600; font-size: 0.92rem; line-height: 1.3; }
      .stat .t { margin-top: 6px; font-family: var(--mono); font-size: 0.72rem; color: var(--faint); }

      /* thesis */
      .thesis .grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 64px; align-items: start; }
      .thesis .h2 { font-size: clamp(2.2rem, 4.6vw, 3.9rem); }
      .thesis p.big { font-family: var(--serif); font-size: clamp(1.25rem, 1.9vw, 1.55rem); line-height: 1.5; margin: 0 0 18px; color: var(--text); }
      .thesis p.rest { font-family: var(--serif); font-size: 1.12rem; line-height: 1.7; color: var(--muted); margin: 0 0 16px; }
      .chain { margin-top: 72px; position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .chain .rail { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); }
      .chain .rail b { position: absolute; inset: 0; background: linear-gradient(90deg, var(--faint), var(--hot), var(--yellow)); transform-origin: 0 50%; transform: scaleX(0); transition: transform 2s var(--ease); }
      .chain.in .rail b { transform: scaleX(1); }
      .chain .chip { position: relative; z-index: 1; padding: 12px 20px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg);
        font-family: var(--mono); font-size: 0.86rem; color: var(--faint); transition: all 0.5s var(--ease); transition-delay: calc(var(--i) * 300ms + 200ms); }
      .chain.in .chip { color: var(--text); border-color: var(--faint); }
      .chain .chip:last-child { font-weight: 600; }
      .chain.in .chip:last-child { background: var(--yellow); border-color: var(--yellow); color: #1b202b; box-shadow: 0 0 40px -6px var(--yellow); }
      .chain .yr { position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: var(--faint); white-space: nowrap; }

      /* principles: sticky story */
      .story { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start; }
      .stage { position: sticky; top: 92px; height: calc(100svh - 124px); max-height: 760px; display: flex; flex-direction: column; border: 1px solid var(--line);
        border-radius: 24px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
      .stage .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 0.74rem; color: var(--faint); }
      .stage .bar b { color: var(--text); font-weight: 600; }
      .stage .diagram { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px 22px; }
      .stage .diagram svg { max-height: 100%; width: auto; max-width: 100%; }
      .stage .foot { border-top: 1px solid var(--line); padding: 16px 20px; min-height: 84px; }
      .stage .foot .lab { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
      .stage .foot .ev { margin-top: 6px; font-weight: 600; font-size: 0.98rem; color: var(--text); }
      .steps { display: flex; flex-direction: column; }
      .step { min-height: 64svh; display: flex; flex-direction: column; justify-content: center; padding: 24px 0; opacity: 0.28; transition: opacity 0.5s var(--ease); }
      .step.on { opacity: 1; }
      .step:first-child { min-height: 46svh; justify-content: flex-start; }
      .step .idx { font-family: var(--mono); font-size: 0.8rem; color: var(--yellow-ink); }
      .step h3 { font-size: clamp(1.6rem, 2.6vw, 2.25rem); letter-spacing: -0.03em; line-height: 1.1; margin: 12px 0 16px; font-weight: 750; text-wrap: balance; }
      .step p { font-family: var(--serif); font-size: 1.12rem; line-height: 1.7; color: var(--muted); margin: 0; max-width: 520px; }
      .step .evd { margin-top: 22px; display: inline-flex; gap: 10px; align-items: baseline; font-family: var(--mono); font-size: 0.8rem; color: var(--text);
        padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card-2); max-width: 520px; }
      .step .evd span { color: var(--yellow-ink); }

      /* bento cases */
      .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
      .tile { --x: 50%; --y: 50%; position: relative; grid-column: span 3; border-radius: 22px; border: 1px solid var(--line); background: var(--card);
        padding: 30px; display: flex; flex-direction: column; overflow: hidden; isolation: isolate; }
      .tile::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity 0.4s;
        background: radial-gradient(520px circle at var(--x) var(--y), color-mix(in srgb, var(--hot) 13%, transparent), transparent 45%); }
      .bento:hover .tile::before { opacity: 1; }
      .tile.big { grid-column: span 4; grid-row: span 2; }
      .tile.tall { grid-column: span 2; grid-row: span 2; }
      .tile.big { border: 1px solid transparent;
        background: linear-gradient(var(--card), var(--card)) padding-box,
          conic-gradient(from var(--ang), var(--line) 0 62%, var(--hot) 74%, var(--yellow) 82%, var(--line) 92%) border-box; }
      html.js .tile.big { animation: spin 6s linear infinite; }
      @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
      @keyframes spin { to { --ang: 360deg; } }
      .tile .org { font-family: var(--mono); font-size: 0.74rem; color: var(--faint); display: flex; justify-content: space-between; gap: 12px; letter-spacing: 0.04em; }
      .tile .org b { color: var(--yellow-ink); font-weight: 500; }
      .tile h3 { font-size: 1.45rem; line-height: 1.15; letter-spacing: -0.025em; margin: 16px 0 12px; font-weight: 750; text-wrap: balance; }
      .tile.big h3 { font-size: clamp(1.8rem, 2.6vw, 2.3rem); max-width: 620px; }
      .tile .sum { font-family: var(--serif); color: var(--muted); line-height: 1.65; margin: 0; font-size: 1rem; }
      .tile.big .sum { font-size: 1.1rem; max-width: 640px; }
      .tile ul { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
      .tile li { position: relative; padding-left: 20px; font-size: 0.92rem; line-height: 1.5; color: var(--muted); }
      .tile li::before { content: ""; position: absolute; left: 2px; top: 0.66em; width: 8px; height: 2px; border-radius: 2px; background: var(--yellow-ink); }
      .wfs { margin-top: 26px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg-soft); padding: 14px 16px; }
      .wfs .lg { display: flex; gap: 16px; font-family: var(--mono); font-size: 0.68rem; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
      .wfs .lg span { display: inline-flex; align-items: center; gap: 6px; }
      .wfs ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 22px; }
      .wfs li { padding: 0; font-family: var(--mono); font-size: 0.74rem; line-height: 1.45; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
      .wfs li i { align-self: center; }
      .wfs li::before { display: none; }
      .wfs li b { color: var(--text); font-weight: 600; min-width: 26px; flex: none; }
      .wfs i { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--hot); }
      .wfs .re i, .wfs i.re { background: var(--yellow); }
      html.js .wfs li i { animation: beat 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * 230ms); }
      @keyframes beat { 0%, 70%, 100% { opacity: 0.35; transform: scale(0.8); } 80% { opacity: 1; transform: scale(1.35); } }
      .tile.big > ul { grid-template-columns: 1fr 1fr; gap: 12px 28px; }
      .metrics { display: flex; flex-wrap: wrap; gap: 10px 34px; margin-top: auto; padding-top: 26px; }
      .metric .v { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; font-variant-numeric: tabular-nums; }
      .tile.big .metric .v { font-size: clamp(2rem, 3.4vw, 3rem); }
      .metric .v.accent { color: var(--accent-text); }
      .metric .ml { font-size: 0.78rem; color: var(--faint); margin-top: 4px; font-family: var(--mono); }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
      .tag { font-family: var(--mono); font-size: 0.7rem; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--bg-soft); }

      /* journey */
      .journey .grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 64px; align-items: start; }
      .journey .sec-head { position: sticky; top: 120px; }
      .tl { position: relative; padding-left: 40px; }
      .tl .rail { position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--line); border-radius: 2px; }
      .tl .rail b { position: absolute; inset: 0; transform-origin: 50% 0; transform: scaleY(var(--p, 0)); background: linear-gradient(180deg, var(--faint), var(--hot) 60%, var(--yellow)); border-radius: 2px; }
      .ti { position: relative; padding: 0 0 46px; }
      .ti:last-child { padding-bottom: 0; }
      .ti .node { position: absolute; left: -38px; top: 5px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--bg); transition: all 0.4s var(--ease); }
      .ti.lit .node { border-color: var(--hot); background: color-mix(in srgb, var(--hot) 30%, var(--bg)); }
      .ti.cur .node { border-color: var(--yellow); background: var(--yellow); box-shadow: 0 0 0 6px color-mix(in srgb, var(--yellow) 22%, transparent); }
      .ti .yrs { font-family: var(--mono); font-size: 0.78rem; color: var(--faint); display: flex; gap: 12px; align-items: center; }
      .ti .yrs .tg { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.68rem; }
      .ti.cur .yrs .tg { border-color: var(--yellow); color: var(--yellow-ink); }
      .ti h3 { margin: 8px 0 2px; font-size: 1.35rem; letter-spacing: -0.02em; font-weight: 700; }
      .ti .rl { color: var(--muted); font-size: 0.95rem; }
      .ti .rl span { color: var(--faint); }
      .ti p { font-family: var(--serif); color: var(--muted); line-height: 1.65; margin: 10px 0 0; max-width: 620px; }
      .ti.cur .card { border: 1px solid color-mix(in srgb, var(--yellow) 45%, var(--line)); background: color-mix(in srgb, var(--yellow) 5%, var(--card)); border-radius: 18px; padding: 20px 22px; margin: -12px 0 0 -10px; }

      /* oss */
      .oss-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; perspective: 1000px; }
      .oss { --gx: 50%; --gy: 50%; position: relative; border-radius: 20px; border: 1px solid var(--line); background: var(--card); padding: 26px; display: flex; flex-direction: column;
        transition: transform 0.5s var(--ease), border-color 0.3s; transform-style: preserve-3d; overflow: hidden; }
      .oss::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        background: radial-gradient(300px circle at var(--gx) var(--gy), rgba(255, 255, 255, 0.07), transparent 50%); }
      .oss:hover { border-color: var(--line-2); }
      .oss:hover::after { opacity: 1; }
      .oss .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .oss .nm { font-family: var(--mono); font-weight: 600; font-size: 1rem; display: inline-flex; align-items: center; gap: 8px; }
      .oss .nm svg { width: 14px; height: 14px; color: var(--faint); transition: transform 0.3s var(--ease), color 0.3s; }
      .oss:hover .nm svg { transform: translate(2px, -2px); color: var(--yellow-ink); }
      .badge { font-family: var(--mono); font-size: 0.68rem; padding: 4px 9px; border-radius: 999px; background: color-mix(in srgb, var(--yellow) 16%, transparent); color: var(--yellow-ink); white-space: nowrap; }
      .oss h3 { font-size: 1.15rem; letter-spacing: -0.02em; margin: 18px 0 8px; line-height: 1.25; font-weight: 700; }
      .oss p { font-family: var(--serif); color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin: 0 0 4px; }
      .oss .tags { margin-top: auto; padding-top: 18px; }

      /* writing + stack */
      .two { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
      .wl { list-style: none; margin: 28px 0 0; padding: 0; border-top: 1px solid var(--line); }
      .wl li { border-bottom: 1px solid var(--line); }
      .wl a, .wl .row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 18px 4px; }
      .wl a:hover .tt { color: var(--accent-text); }
      .wl .tt { font-weight: 600; line-height: 1.35; transition: color 0.2s; }
      .wl .sub2 { font-family: var(--mono); font-size: 0.72rem; color: var(--faint); margin-top: 4px; }
      .wl .soon .tt { color: var(--muted); font-weight: 500; }
      .wl .soon-b { font-family: var(--mono); font-size: 0.66rem; padding: 3px 8px; border-radius: 999px; border: 1px dashed var(--line-2); color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
      .wl .arrow { width: 16px; height: 16px; color: var(--faint); }
      .wgroup { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); margin-top: 26px; }
      .stack-rows { margin-top: 28px; display: grid; gap: 14px; }
      .srow { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: start; }
      .srow .g { font-family: var(--mono); font-size: 0.74rem; color: var(--yellow-ink); padding-top: 7px; text-transform: uppercase; letter-spacing: 0.08em; }
      .srow .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .srow .chips span { font-size: 0.85rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); transition: border-color 0.2s, transform 0.2s; }
      .srow .chips span:hover { border-color: var(--hot); transform: translateY(-1px); }
      .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 30px; }
      .fact { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--bg-soft); }
      .fact .k { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
      .fact .v { font-size: 0.88rem; margin-top: 6px; line-height: 1.4; font-weight: 500; }

      /* contact */
      .contact { padding: 140px 0 110px; text-align: center; overflow: hidden; isolation: isolate; border-top: 1px solid var(--line); }
      .contact .bg-dots { -webkit-mask-image: radial-gradient(ellipse 55% 60% at 50% 50%, #000 10%, transparent 70%); mask-image: radial-gradient(ellipse 55% 60% at 50% 50%, #000 10%, transparent 70%); }
      .contact .glow { position: absolute; left: 50%; top: 50%; width: 900px; height: 500px; transform: translate(-50%, -50%); z-index: -2; pointer-events: none;
        background: radial-gradient(closest-side, color-mix(in srgb, var(--purple) 30%, transparent), transparent); opacity: calc(var(--aurora) * 1.6); filter: blur(30px); }
      .contact .kicker { justify-content: center; }
      .contact h2 { font-size: clamp(2.6rem, 7vw, 6rem); letter-spacing: -0.05em; line-height: 0.98; font-weight: 850; margin: 22px auto 0; max-width: 980px; text-wrap: balance; }
      .contact p { font-family: var(--serif); font-size: 1.2rem; color: var(--muted); max-width: 560px; margin: 24px auto 0; line-height: 1.6; }
      .contact .ctas { justify-content: center; margin-top: 40px; }
      .socials { display: flex; justify-content: center; gap: 10px; margin-top: 38px; }
      .socials a { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--card); transition: transform 0.3s var(--ease), border-color 0.3s; }
      .socials a:hover { transform: translateY(-3px); border-color: var(--faint); }

      footer { border-top: 1px solid var(--line); }
      footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 28px 0; font-size: 0.86rem; color: var(--faint); flex-wrap: wrap; }
      footer .logo { font-size: 1.3rem; color: var(--text); }
      footer b { color: var(--text); }
      .totop { border: 1px solid var(--line); background: var(--card); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: transform 0.3s var(--ease); }
      .totop:hover { transform: translateY(-3px); }
      .totop svg { width: 16px; height: 16px; }

      /* responsive */
      @media (max-width: 1100px) {
        .top nav { display: none; }
        .stats .wrap { grid-template-columns: repeat(3, 1fr); }
        .stat { border-top: 1px solid var(--line); }
        .stat:nth-child(-n + 3) { border-top: 0; }
        .stat:nth-child(3n + 1) { border-left: 0; padding-left: 0; }
        .tile.big { grid-column: span 6; grid-row: auto; }
        .tile.tall { grid-column: span 6; grid-row: auto; }
      }
      @media (max-width: 900px) {
        .sec { padding: 88px 0; }
        .hero { min-height: 0; padding-top: 40px; }
        .hero .wrap, .thesis .grid, .journey .grid, .two { grid-template-columns: 1fr; gap: 48px; }
        .journey .sec-head { position: static; }
        .story { grid-template-columns: 1fr; gap: 0; }
        .stage { display: none; }
        .step, .step:first-child { min-height: 0; opacity: 1; padding: 28px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); }
        .bento { grid-template-columns: 1fr; }
        .tile, .tile.big, .tile.tall { grid-column: auto; }

        .wfs ol { grid-template-columns: 1fr; }
        .oss-grid { grid-template-columns: 1fr 1fr; }
        .chain { flex-wrap: wrap; justify-content: flex-start; row-gap: 40px; }
        .chain .rail { display: none; }
      }
      @media (max-width: 640px) {
        .wrap { width: min(1240px, 100% - 36px); }
        .stats .wrap { grid-template-columns: 1fr 1fr; }
        .stat, .stat:nth-child(-n + 3) { border-top: 1px solid var(--line); border-left: 0; padding: 24px 0; }
        .stat:nth-child(-n + 2) { border-top: 0; }
        .stat:nth-child(even) { padding-left: 18px; border-left: 1px solid var(--line); }
        .oss-grid, .facts { grid-template-columns: 1fr; }
        .tile { padding: 24px; }
        .pill.resume span { display: none; }
        .top .wrap { gap: 10px; height: 62px; }
        .logo { font-size: 1.4rem; }
        .hdr-right { gap: 8px; }
        #prefs { --kc-h: 34px; --kc-pad: 3px; gap: 5px; }
        #prefs button { padding: 0 7px; }
        #prefs .kc-theme button { padding: 0; }
        .pill.resume { width: 34px; height: 34px; padding: 0; justify-content: center; }
        .role { font-size: 0.74rem; }
        .focus li { height: 32px; font-size: 0.8rem; padding: 0 12px 0 10px; }
        .btn { height: 50px; padding: 0 22px; }
        .ctas .btn { flex: 1 1 auto; justify-content: center; }
        .srow { grid-template-columns: 1fr; gap: 8px; }
        .srow .g { padding-top: 0; }
        .chain .chip { padding: 10px 14px; font-size: 0.8rem; }
      }

      @media (max-width: 360px) {
        .logo { font-size: 1.25rem; }
        .role .rt, .role .rs { white-space: normal; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        html.js .rv { transform: none; }
        .aurora b { animation: none; }
        .pulse::after { display: none; }
      }
    </style>

  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="progress" aria-hidden="true"></div>

    <header class="top">

    <main id="main">
      <section class="hero" id="top">
        <div class="aurora" aria-hidden="true"><b></b><b></b><b></b></div>
        <div class="bg-dots" aria-hidden="true"></div>
        <div class="bg-dots-hot" aria-hidden="true"></div>
        <div class="wrap">
          <div>
            <span class="hello" id="hello"></span>
            <p class="role" id="role"></p>
            <h1 class="headline" id="headline"></h1>
            <ul class="focus" id="focus"></ul>
            <p class="sub" id="sub"></p>

              <a class="btn btn-primary mag" id="ctaWork" href="#work"></a>

      <section class="stats" aria-label="Numbers">

          };
          const ends = { e1: "checks", e2: "llm", eSkip: "skip", e3: "gate", eAuto: "action", eH1: "human", eH2: "action" };
          const order = ["event", "checks", "llm", "gate", "action"];
          let s = `<svg class="pipe" viewBox="0 0 520 600" aria-hidden="true">`;
          for (const [k, d] of Object.entries(E)) s += `<path class="edge" data-e="${k}" d="${d}"/>`;
          s += `<text class="elab" x="272" y="470">${esc(T.auto)}</text><text class="elab" x="106" y="424">${esc(T.review)}</text>`;
          for (const [id, [x, y, w, h]] of Object.entries(N)) {
            const r = id === "gate" ? 12 : h / 2;
            const i = order.indexOf(id);
            let inner;
            if (id === "skip") inner = `<text x="0" y="4" text-anchor="middle">${esc(label[id])}</text>`;
            else {
              const mark = id === "gate" ? `<path class="gem" d="M${-w / 2 + 24} -7 l7 7 -7 7 -7 -7z"/>` : `<circle class="dot" cx="${-w / 2 + 24}" cy="0" r="4"/>`;
              const num = i >= 0 ? `<text class="num" x="${-w / 2 - 12}" y="4" text-anchor="end">0${i + 1}</text>` : "";
              inner = `${mark}<text x="${-w / 2 + 42}" y="5">${esc(label[id])}</text>${num}`;
            }
            s += `<g class="node node-${id}" data-n="${id}" transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${r}"/>${inner}</g>`;
          }
          s += `<g class="packets"></g></svg>`;
          host.innerHTML = s;
          const svg = host.querySelector("svg");
          // Shrink any node label that would spill out of its pill (long PT labels).
          const fitLabels = () =>
            svg.querySelectorAll(".node").forEach((g) => {
              const id = g.dataset.n;
              const w = N[id][2];
              const t = [...g.querySelectorAll("text")].find((x) => !x.classList.contains("num"));
              if (!t) return;
              t.style.fontSize = "";
              const room = id === "skip" ? w - 16 : w - 42 - 16;
              const len = t.getComputedTextLength();
              if (len > room) t.style.fontSize = parseFloat(getComputedStyle(t).fontSize) * (room / len) + "px";
            });
          fitLabels();
          document.fonts && document.fonts.ready.then(fitLabels);
          const pk = svg.querySelector(".packets");
          const paths = {};
          svg.querySelectorAll(".edge").forEach((p) => (paths[p.dataset.e] = { el: p, len: p.getTotalLength() }));
          const nodes = {};
          svg.querySelectorAll(".node").forEach((g) => (nodes[g.dataset.n] = g));
          const hit = (id) => {
            const g = nodes[id];
            g.classList.add("hit");
            clearTimeout(g._t);
            g._t = setTimeout(() => g.classList.remove("hit"), 420);
          };
          const routes = { skip: ["e1", "eSkip"], auto: ["e1", "e2", "e3", "eAuto"], review: ["e1", "e2", "e3", "eH1", "eH2"] };
          let packets = [];
          let running = false;
          let last = 0;
          let nextSpawn = 0;
          const logEl = opts.log;
          const stamp = () => new Date().toTimeString().slice(0, 8);
          function spawn() {
            const r = Math.random();
            const kind = r < 0.36 ? "skip" : r < 0.74 ? "auto" : "review";
            let wf = M.workflows[(Math.random() * M.workflows.length) | 0];
            if (wf === spawn.prev) wf = M.workflows[(M.workflows.indexOf(wf) + 1) % M.workflows.length];
            spawn.prev = wf;
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("r", 4.5);
            c.setAttribute("cx", 260);
            c.setAttribute("cy", 80);
            pk.appendChild(c);
            packets.push({ kind, wf, seg: 0, d: 0, el: c, wait: 0, speed: 170 + Math.random() * 50 });
            hit("event");
          }
          function done(p) {
            if (!logEl) return;
            const line = document.createElement("div");
            const verdict = p.kind === "skip" ? `${T.skip}` : p.kind === "auto" ? `gate → ${T.auto}` : `gate → ${T.review}`;
            line.innerHTML = `${stamp()}  <b style="font-weight:600;color:var(--text)">${p.wf.id.padEnd(3, " ")}</b>  <span class="nm">${esc(p.wf[L])}  </span><span class="k-${p.kind}">${esc(verdict)}</span>`;
            logEl.appendChild(line);
            while (logEl.children.length > 3) logEl.firstChild.remove();
          }
          function frame(t) {
            if (!running) return;
            const dt = Math.min(48, t - (last || t)) / 1000;
            last = t;
            if (t > nextSpawn) {
              spawn();
              nextSpawn = t + 620 + Math.random() * 760;
            }
            for (const p of packets) {
              const segs = routes[p.kind];
              if (p.wait > 0) {
                p.wait -= dt;
                continue;
              }
              p.d += p.speed * dt;
              const cur = paths[segs[p.seg]];
              if (p.d >= cur.len) {
                const end = ends[segs[p.seg]];
                hit(end);
                p.seg++;
                p.d = 0;
                if (end === "gate") p.wait = 0.28;
                if (p.seg >= segs.length) {
                  p.dead = true;
                  p.el.remove();
                  done(p);
                  continue;
                }
                p.el.setAttribute("class", "pkt s-" + segs[p.seg]);
              }
              const pt = paths[segs[p.seg]].el.getPointAtLength(p.d);
              p.el.setAttribute("cx", pt.x.toFixed(1));
              p.el.setAttribute("cy", pt.y.toFixed(1));
              if (!p.el.getAttribute("class")) p.el.setAttribute("class", "pkt s-" + segs[p.seg]);
            }
            packets = packets.filter((p) => !p.dead);
            requestAnimationFrame(frame);
          }
          let visible = false;
          const sync = () => {
            const should = visible && !document.hidden && !reduce;
            if (should && !running) {
              running = true;
              last = 0;
              requestAnimationFrame(frame);
            } else if (!should) running = false;
          };
          new IntersectionObserver(([e]) => {
            visible = e.isIntersecting;
            sync();
          }).observe(host);
          document.addEventListener("visibilitychange", sync);
          if (logEl) {
            [0, 6, 1].forEach((n, i) => done({ wf: M.workflows[n % M.workflows.length], kind: ["auto", "review", "skip"][i] }));
          }
          return {
            focus(ids) {
              svg.classList.toggle("focus", !!ids);
              Object.entries(nodes).forEach(([id, g]) => g.classList.toggle("on", !!ids && ids.includes(id)));
            },
          };
        }

        pipeline($("#heroPipe"), { log: $("#heroLog") });
        const story = pipeline($("#storyPipe"));

        /* ---------- principles scroll story ---------- */
        const stageMap = {
          deterministic: ["checks"],
          gates: ["gate", "human"],
          "ground-truth": ["llm"],
          evals: ["llm", "gate"],
          tracing: ["event", "action"],
          "less-context": ["llm"],
          dormant: ["action"],
        };
        const steps = $$(".step");
        const setStep = (i) => {
          steps.forEach((s, j) => s.classList.toggle("on", j === i));
          const p = C.principles[i];
          story.focus(stageMap[p.id]);
          $("#stageCount").textContent = `${String(i + 1).padStart(2, "0")} / ${String(C.principles.length).padStart(2, "0")}`;
          $("#stageEv").textContent = p.evidence;
        };
        setStep(0);
        const stepIO = new IntersectionObserver(
          (entries) => entries.forEach((e) => e.isIntersecting && setStep(+e.target.dataset.i)),
          { rootMargin: "-48% 0px -48% 0px" }
        );
        steps.forEach((s) => stepIO.observe(s));

        /* ---------- reveal on view ---------- */
        const rvIO = new IntersectionObserver(
          (entries) =>
            entries.forEach((e) => {
              if (!e.isIntersecting) return;
              e.target.classList.add("in");
              rvIO.unobserve(e.target);
            }),
          { rootMargin: "0px 0px -8% 0px" }
        );
        $$(".rv").forEach((el) => rvIO.observe(el));
        const chainIO = new IntersectionObserver(([e]) => e.isIntersecting && (e.target.classList.add("in"), chainIO.disconnect()), { threshold: 0.6 });
        chainIO.observe($("#chain"));

        /* ---------- counters ---------- */
        const cntIO = new IntersectionObserver(
          (entries) =>
            entries.forEach((e) => {
              if (!e.isIntersecting) return;
              cntIO.unobserve(e.target);
              const el = e.target;
              const to = +el.dataset.to;
              if (reduce) return (el.textContent = to);
              const t0 = performance.now();
              const dur = 1500 + Math.min(to, 300) * 2;
              const tick = (t) => {
                const k = Math.min(1, (t - t0) / dur);
                el.textContent = Math.round(to * (1 - Math.pow(1 - k, 4)));
                if (k < 1) requestAnimationFrame(tick);
              };
              requestAnimationFrame(tick);
            }),
          { threshold: 0.6 }
        );
        $$(".cnt").forEach((el) => cntIO.observe(el));

        /* ---------- role scramble ---------- */
        // Scrambles each part inside its own fixed span, so wrapping never changes mid-effect.
        if (!reduce) {
          const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+/<>";
          const t0 = performance.now() + 350;
          const dur = 1300;
          const total = roleParts.reduce((n, [, t]) => n + t.length, 0);
          const tick = (t) => {
            const k = Math.max(0, Math.min(1, (t - t0) / dur));
            let n = Math.floor(k * total);
            roleParts.forEach(([el, target]) => {
              let out = "";
              for (let i = 0; i < target.length; i++) {
                const ch = target[i];
                out += n > 0 || ch === " " || ch === "-" || ch === "," ? ch : glyphs[(Math.random() * glyphs.length) | 0];
                n--;
              }
              el.textContent = out;
            });
            if (k < 1) requestAnimationFrame(tick);
            else roleParts.forEach(([el, target]) => (el.textContent = target));
          };
          requestAnimationFrame(tick);
        }

        /* ---------- pointer effects ---------- */
        if (finePointer && !reduce) {
          const hero = $(".hero");
          hero.addEventListener("pointermove", (e) => {
            const r = hero.getBoundingClientRect();
            hero.style.setProperty("--mx", `${e.clientX - r.left}px`);
            hero.style.setProperty("--my", `${e.clientY - r.top}px`);
          });
          $$(".mag").forEach((b) => {
            b.addEventListener("pointermove", (e) => {
              const r = b.getBoundingClientRect();
              b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * 0.22}px, ${(e.clientY - r.top - r.height / 2) * 0.32}px)`;
            });
            b.addEventListener("pointerleave", () => (b.style.transform = ""));
          });
          const bento = $("#bento");
          const tiles = $$(".tile", bento);
          bento.addEventListener("pointermove", (e) => {
            for (const t of tiles) {
              const r = t.getBoundingClientRect();
              t.style.setProperty("--x", `${e.clientX - r.left}px`);
              t.style.setProperty("--y", `${e.clientY - r.top}px`);
            }
          });
          $$(".oss").forEach((card) => {
            card.addEventListener("pointermove", (e) => {
              const r = card.getBoundingClientRect();
              const x = (e.clientX - r.left) / r.width - 0.5;
              const y = (e.clientY - r.top) / r.height - 0.5;
              card.style.transition = "transform .12s linear, border-color .3s";
              card.style.transform = `rotateX(${(-y * 7).toFixed(2)}deg) rotateY(${(x * 7).toFixed(2)}deg) translateZ(0)`;
              card.style.setProperty("--gx", `${(x + 0.5) * 100}%`);
              card.style.setProperty("--gy", `${(y + 0.5) * 100}%`);
            });
            card.addEventListener("pointerleave", () => {
              card.style.transition = "";
              card.style.transform = "";
            });
          });
        }

        /* ---------- scroll-linked: header, timeline rail, nav spy ---------- */
        const header = $("header.top");
        const tl = $("#tl");
        const tis = $$(".ti", tl);
        const navLinks = $$("#nav a");
        const secs = navItems.map(([id]) => document.getElementById(id));
        let ticking = false;
        const onScroll = () => {
          ticking = false;
          header.classList.toggle("scrolled", scrollY > 8);
          const vh = innerHeight;
          const r = tl.getBoundingClientRect();
          const p = Math.max(0, Math.min(1, (vh * 0.62 - r.top) / r.height));
          tl.style.setProperty("--p", p.toFixed(4));
          tis.forEach((t) => t.classList.toggle("lit", t.getBoundingClientRect().top < vh * 0.62));
          let cur = -1;
          secs.forEach((s, i) => s && s.getBoundingClientRect().top < vh * 0.4 && (cur = i));
          navLinks.forEach((a, i) => a.classList.toggle("on", i === cur));
        };
        addEventListener(
          "scroll",
          () => {
            if (!ticking) {
              ticking = true;
              requestAnimationFrame(onScroll);
            }
          },
          { passive: true }
        );
        addEventListener("resize", onScroll);
        onScroll();
      })();
    </script>
  </body>
</html>
