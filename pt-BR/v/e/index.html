      .f-text h3 { font-weight: 850; font-size: clamp(2rem, 3.6vw, 3.3rem); letter-spacing: -0.04em; line-height: 1.04; margin: 0 0 22px; text-wrap: balance; }
      .lede { font-family: var(--serif); font-size: 1.2rem; line-height: 1.75; color: var(--fg); margin: 0 0 24px; }
      .f-text ul { list-style: none; margin: 0 0 26px; padding: 0; }
      .f-text li { font-family: var(--serif); color: var(--muted); font-size: 1.04rem; line-height: 1.7; padding: 10px 0 10px 30px; border-top: 1px dashed var(--line); position: relative; }
      .f-text li::before { content: "\00A7"; position: absolute; left: 4px; top: 10px; color: var(--y); font-weight: 600; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { font: 500 0.74rem var(--mono); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
      .f-figs { display: grid; gap: 4px; }
      .fig { padding: 18px 0 20px; border-bottom: 1px solid var(--line); }
      .fig:last-child { border-bottom: 0; }
      .fig .num { font-weight: 850; letter-spacing: -0.05em; line-height: 0.95; font-size: clamp(3.4rem, 7vw, 6.4rem); font-variant-numeric: tabular-nums; }
      .fig .num.long { font-size: clamp(2.3rem, 4.4vw, 4rem); letter-spacing: -0.04em; }
      .fig .num .to { color: var(--y); font-weight: 500; }
      .fig .lab { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 1.02rem; margin-top: 10px; }

      /* journey: pinned horizontal */
      .journey { position: relative; }
      .hs-sticky { position: sticky; top: 64px; height: calc(100vh - 64px); height: calc(100dvh - 64px); overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
      .hs-head { width: var(--wrap); margin: 0 auto 36px; display: flex; justify-content: space-between; align-items: end; gap: 24px; }
      .hs-head .ch-head { margin: 0; flex: 1; }
      .hint { font: 600 0.74rem var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); white-space: nowrap; }
      .hint span { display: inline-block; animation: nudge 1.8s var(--ease) infinite; }
      @keyframes nudge { 50% { transform: translateX(6px); } }
      .hs-track { display: flex; gap: 0; width: max-content; padding-left: calc((100vw - min(1240px, 100vw - 48px)) / 2); padding-right: 12vw; will-change: transform; }
      .panel { width: min(470px, 82vw); padding: 0 44px 0 0; margin-right: 44px; border-right: 1px solid var(--line); flex: none; }
      .panel:last-child { border-right: 0; }
      .yr { font-weight: 900; font-size: clamp(5rem, 11vw, 9.5rem); line-height: 0.85; letter-spacing: -0.06em; color: color-mix(in srgb, var(--fg) 10%, var(--bg)); margin-bottom: 22px; transition: color 0.5s; }
      .panel:hover .yr { color: color-mix(in srgb, var(--fg) 22%, var(--bg)); }
      .panel.now .yr, .panel.now:hover .yr { color: var(--y); }
      .range { font: 600 0.74rem var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); display: flex; gap: 10px; align-items: center; }
      .range i { width: 7px; height: 7px; border-radius: 50%; background: var(--y); display: inline-block; }
      .panel h3 { font-weight: 850; font-size: 2rem; letter-spacing: -0.035em; margin: 12px 0 4px; }
      .panel .rl { font-family: var(--serif); font-style: italic; color: var(--fg); font-size: 1.08rem; }
      .panel .pl { font: 400 0.76rem var(--mono); color: var(--soft); margin-top: 4px; }
      .panel p { font-family: var(--serif); color: var(--muted); font-size: 1.04rem; line-height: 1.72; margin: 18px 0 0; }
      .hs-bar { width: var(--wrap); margin: 44px auto 0; height: 2px; background: var(--line); position: relative; }
      .hs-bar span { position: absolute; inset: 0; background: var(--fg); transform-origin: 0 50%; transform: scaleX(0); }
      .journey.static .hs-sticky { position: static; height: auto; overflow: visible; display: block; }
      .journey.static .hs-track { width: var(--wrap); margin: 0 auto; padding: 0; flex-direction: column; transform: none !important; }
      .journey.static .panel { width: auto; margin: 0; padding: 36px 0; border-right: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 0.9fr) 1.1fr; gap: 0 40px; }
      .journey.static .panel .yr { grid-row: span 6; font-size: clamp(4rem, 10vw, 7.5rem); }
      .journey.static .hs-bar, .journey.static .hint { display: none; }

      /* index table */
      .index { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fg); }
      .index a { display: grid; grid-template-columns: 56px 220px 1fr 150px 40px; gap: 24px; align-items: baseline; padding: 26px 12px; border-bottom: 1px solid var(--line); text-decoration: none; transition: background-color 0.3s, padding 0.4s var(--ease); }
      .index a:hover { background: var(--mist); padding-left: 22px; }
      .index .no { font: 600 0.74rem var(--mono); color: var(--soft); }
      .index .nm { font: 600 1.25rem var(--mono); letter-spacing: -0.02em; }
      .index a:hover .nm { box-shadow: inset 0 -0.35em 0 var(--hl); }
      .index .tg { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; }
      .index .dt { display: block; color: var(--muted); font-size: 0.95rem; margin-top: 6px; line-height: 1.6; }
      .index .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .index .st { font: 500 0.78rem var(--mono); color: var(--soft); text-align: right; }
      .index .go { font-size: 1.3rem; transition: transform 0.35s var(--ease); justify-self: end; }
      .index a:hover .go { transform: translate(4px, -4px); color: var(--y); }

      /* toc */
      .toc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
      .toc h3 { font: 600 0.74rem var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--soft); border-top: 2px solid var(--fg); padding-top: 12px; margin: 0 0 8px; }
      .toc ol { list-style: none; margin: 0; padding: 0; }
      .toc li { display: flex; align-items: baseline; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
      .toc .t { font-family: var(--serif); font-size: 1.14rem; line-height: 1.45; text-decoration: none; }
      .toc a.t:hover { color: var(--link); }
      .toc .lead { flex: 1; border-bottom: 2px dotted var(--line); transform: translateY(-5px); min-width: 24px; }
      .toc .pg { font: 500 0.76rem var(--mono); color: var(--soft); white-space: nowrap; }
      .toc .soon .t { color: var(--muted); }
      .toc .soon .pg { color: var(--y-ink); }
      .allposts { display: inline-flex; align-items: center; gap: 10px; margin-top: 40px; font: 600 0.95rem var(--sans); text-decoration: none; border-bottom: 2px solid var(--y); padding-bottom: 4px; }
      .allposts .arr { transition: transform 0.3s var(--ease); }
      .allposts:hover .arr { transform: translateX(4px); }
      .allposts:hover { color: var(--link); }

      /* marquee */
      .stack { padding: 110px 0 30px; }
      .marquee { overflow: hidden; border-top: 1px solid var(--fg); border-bottom: 1px solid var(--line); padding: 26px 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
      .m-track { display: flex; width: max-content; animation: marquee 80s linear infinite; }
      .marquee:hover .m-track, .marquee.paused .m-track { animation-play-state: paused; }
      .m-row { display: flex; align-items: baseline; gap: 22px; padding-right: 22px; white-space: nowrap; font-family: var(--serif); font-size: clamp(1.6rem, 3vw, 2.4rem); }
      .m-row .g { font-family: var(--script); color: var(--y); font-size: 1.15em; }
      .m-row .b { color: var(--soft); font-size: 0.6em; }
      @keyframes marquee { to { transform: translateX(-50%); } }
      .stack-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 22px; gap: 20px; }
      .stack-head h2 { margin: 0; font-weight: 850; font-size: clamp(1.8rem, 3.4vw, 2.8rem); letter-spacing: -0.04em; }
      .stack-head .k { font: 600 0.74rem var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--soft); display: block; margin-bottom: 8px; }
      .tiny { font: 600 0.74rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
      .tiny:hover { color: var(--fg); border-color: var(--fg); }

      /* contact */
      .closing { padding: 140px 0 60px; text-align: left; }
      .closing .hello { margin-bottom: 18px; }
      .closing h2 { font-weight: 900; font-size: clamp(3rem, 9vw, 8.6rem); letter-spacing: -0.055em; line-height: 0.92; margin: 0 0 30px; text-wrap: balance; }
      .closing p.s { font-family: var(--serif); font-size: 1.25rem; color: var(--muted); line-height: 1.7; max-width: 34em; margin: 0 0 44px; }
      .mail { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-bottom: 40px; }
      .mail a.big { font-family: var(--serif); font-size: clamp(1.8rem, 4.6vw, 3.6rem); text-decoration: none; letter-spacing: -0.02em; background-image: linear-gradient(var(--y), var(--y)); background-size: 100% 0.12em; background-position: 0 92%; background-repeat: no-repeat; transition: background-size 0.4s var(--ease); }
      .mail a.big:hover { background-size: 100% 0.5em; }
      .dark .mail a.big:hover { color: #1b202b; background-size: 100% 100%; }
      .socials { display: flex; flex-wrap: wrap; gap: 10px 26px; font: 500 0.9rem var(--mono); }
      .socials a { text-decoration: none; color: var(--muted); }
      .socials a:hover { color: var(--fg); }
      .colophon { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; border-top: 1px solid var(--fg); margin-top: 90px; padding-top: 22px; }
      .colophon dt { font: 600 0.7rem var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--soft); margin-bottom: 8px; }
      .colophon dd { margin: 0; font-family: var(--serif); font-size: 1.05rem; line-height: 1.5; }
      footer.foot { border-top: 1px solid var(--line); margin-top: 60px; }
      footer.foot .wrap { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 30px 0; flex-wrap: wrap; }
      footer .small { font-size: 0.85rem; color: var(--soft); }
      footer .small b { color: var(--fg); }
      footer .set { font-family: var(--serif); font-style: italic; font-size: 0.82rem; color: var(--soft); }


      /* ---------- night-edition glow (dark only) ---------- */
      .lead { position: relative; isolation: isolate; }
      .aura { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; opacity: 0; transition: opacity 0.6s; }
      .dark .aura { opacity: 1; }
      .aura i { position: absolute; border-radius: 50%; filter: blur(70px); }
      .aura i:nth-child(1) { width: 560px; height: 560px; right: 4%; top: 2%; background: radial-gradient(circle, rgba(96, 41, 255, 0.34), transparent 68%); }
      .aura i:nth-child(2) { width: 480px; height: 480px; left: -6%; top: 46%; background: radial-gradient(circle, rgba(0, 86, 255, 0.24), transparent 68%); }
      .aura i:nth-child(3) { width: 360px; height: 360px; right: 18%; bottom: 4%; background: radial-gradient(circle, rgba(253, 188, 22, 0.1), transparent 70%); }
      .motion .dark .aura i, .dark.motion .aura i { animation: drift 18s ease-in-out infinite alternate; }
      .aura i:nth-child(2) { animation-delay: -6s; }
      .aura i:nth-child(3) { animation-delay: -11s; }
      @keyframes drift { to { transform: translate3d(40px, -30px, 0) scale(1.08); } }
      .dark .mast nav a:hover, .dark .socials a:hover { color: var(--accent); }
      .dark .index a:hover .go { color: var(--accent); }
      .dark .progress { background: linear-gradient(90deg, #6029ff, #0056ff 60%, #fdbc16); }
      .dark .ring svg { filter: drop-shadow(0 0 18px rgba(96, 41, 255, 0.35)); }

      /* ---------- Fig. 2: the runtime ---------- */
      .fig2 { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); gap: 72px; align-items: center; padding: 64px 0 96px; border-top: 1px solid var(--line); }
      .fig2 .ch-num { max-width: 360px; margin-bottom: 28px; }
      .fig2 h2 { font-weight: 850; font-size: clamp(2rem, 3.6vw, 3.1rem); letter-spacing: -0.04em; line-height: 1.04; margin: 0 0 20px; text-wrap: balance; }
      .fig2 .cap { font-family: var(--serif); font-size: 1.14rem; line-height: 1.75; color: var(--muted); margin: 0 0 30px; max-width: 34em; }
      .steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fg); }
      .steps li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 14px; padding: 13px 8px 13px 0; border-bottom: 1px solid var(--line); cursor: default; transition: background-color 0.3s, padding 0.35s var(--ease); border-radius: 2px; }
      .steps li:hover, .steps li:focus-visible, .steps li.on { background: color-mix(in srgb, var(--mist) 80%, transparent); padding-left: 10px; }
      .steps .no { font: 600 0.72rem/1.9 var(--mono); color: var(--soft); grid-row: span 2; }
      .steps b { font-weight: 700; font-size: 1.02rem; letter-spacing: -0.01em; justify-self: start; }
      .steps li[data-n="gate"] b { box-shadow: inset 0 -0.38em 0 var(--hl); }
      .steps span.dt { font-family: var(--serif); font-size: 0.96rem; line-height: 1.55; color: var(--muted); }
      .fig2 figure { margin: 0; }
      .frame { position: relative; border: 1px solid var(--line); border-radius: 24px; background: color-mix(in srgb, var(--mist) 45%, var(--bg)); overflow: hidden; transition: background-color 0.4s, border-color 0.4s; }
      .dark .frame { background: color-mix(in srgb, #1a1a1f 70%, transparent); box-shadow: 0 30px 80px -40px rgba(96, 41, 255, 0.45); }
      .frame .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); font: 500 0.7rem/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
      .frame .bar .live { display: inline-flex; align-items: center; gap: 8px; color: var(--y-ink); }
      .frame .bar .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--y); animation: pulseY 2s infinite; }
      @keyframes pulseY { 70% { box-shadow: 0 0 0 7px rgba(253, 188, 22, 0); } 0% { box-shadow: 0 0 0 0 rgba(253, 188, 22, 0.5); } }
      .canvas { padding: 22px 18px 6px; }
      svg.pipe { display: block; width: 100%; height: auto; max-height: min(540px, 64vh); overflow: visible; }
      .pipe .edge { fill: none; stroke: color-mix(in srgb, var(--fg) 30%, transparent); stroke-width: 1.2; stroke-dasharray: 3 5; }
      .pipe .edge.h { stroke: color-mix(in srgb, var(--y) 75%, transparent); }
      .motion .pipe .edge { animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      .pipe .node { transition: opacity 0.4s; }
      .pipe .node rect { fill: var(--bg); stroke: color-mix(in srgb, var(--fg) 55%, transparent); stroke-width: 1; transition: stroke 0.3s, fill 0.3s; }
      .pipe .node text { fill: var(--fg); font: 600 15px var(--sans); letter-spacing: -0.01em; }
      .pipe .node .dot { fill: var(--soft); transition: fill 0.3s; }
      .pipe .node .num { fill: var(--soft); font: 500 10.5px var(--mono); letter-spacing: 0.04em; }
      .pipe .gem { fill: var(--y); }
      .pipe .node-gate rect { stroke: var(--y); stroke-width: 1.6; }
      .pipe .node-skip rect, .pipe .node-human rect { fill: transparent; stroke-dasharray: 3 4; }
      .pipe .node-human rect { stroke: color-mix(in srgb, var(--y) 85%, transparent); }
      .pipe .node-skip text { font: 500 12.5px var(--mono); fill: var(--soft); }
      .pipe .node-human text { font-size: 14px; }
      .pipe .node.hit rect { stroke: var(--fg); fill: color-mix(in srgb, var(--fg) 7%, var(--bg)); }
      .pipe .node.hit .dot { fill: var(--fg); }
      .pipe .node-gate.hit rect, .pipe .node-human.hit rect { stroke: var(--y); fill: color-mix(in srgb, var(--y) 22%, var(--bg)); }
      .dark .pipe .node.hit rect { stroke: var(--accent); fill: color-mix(in srgb, var(--accent) 18%, var(--bg)); }
      .dark .pipe .node.hit .dot { fill: var(--accent); }
      .dark .pipe .node-gate.hit rect, .dark .pipe .node-human.hit rect { stroke: var(--y); fill: color-mix(in srgb, var(--y) 16%, var(--bg)); }
      .pipe .elab { fill: var(--soft); font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
      .pipe .pkt { fill: var(--fg); }
      .pipe .pkt.s-e3, .pipe .pkt.s-eAuto { fill: #0056ff; }
      .dark .pipe .pkt { filter: drop-shadow(0 0 5px rgba(240, 240, 240, 0.6)); }
      .dark .pipe .pkt.s-e3, .dark .pipe .pkt.s-eAuto { fill: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
      .pipe .pkt.s-eH1, .pipe .pkt.s-eH2 { fill: var(--y); }
      .pipe .pkt.s-eSkip { fill: var(--soft); }
      .pipe.focus .node:not(.on) { opacity: 0.25; }
      .pipe.focus .node.on rect { stroke: var(--y); stroke-width: 1.8; fill: color-mix(in srgb, var(--y) 18%, var(--bg)); }
      .pipe.focus .node.on .dot { fill: var(--y-ink); }
      .trace { border-top: 1px solid var(--line); padding: 12px 20px; font: 400 0.74rem/1.6 var(--mono); color: var(--soft);
        height: calc(3 * 1.6em + 2 * 4px + 24px); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
      .trace div { flex: none; white-space: nowrap; animation: tIn 0.4s var(--ease); }
      .trace b { color: var(--fg); font-weight: 600; }
      .trace .k-auto { color: #0056ff; }
      .dark .trace .k-auto { color: var(--accent); }
      .trace .k-review { color: var(--y-ink); }
      @keyframes tIn { from { opacity: 0; transform: translateY(6px); } }
      .fig2 figcaption { margin-top: 16px; text-align: left; }

      /* journey: shorter panels for the desktop pin */
      .panel { width: min(380px, 34vw); padding-right: 34px; margin-right: 34px; }
      .yr { font-size: clamp(4.2rem, 8vw, 7.2rem); }
      .hs-bar { height: 3px; border-radius: 3px; overflow: visible; }
      .hs-bar span { background: var(--y); border-radius: 3px; }
      .hs-ends { width: var(--wrap); margin: 12px auto 0; display: flex; justify-content: space-between; font: 600 0.72rem var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft); }
      .journey.static .hs-ends { display: none; }

      /* ---------- responsive ---------- */
      @media (max-width: 1180px) {
        .mast nav a:not(.pill) { display: none; }
      }
      @media (max-width: 1100px) {
        .stats { grid-template-columns: repeat(3, 1fr); }
        .stat:nth-child(3n) { border-right: 0; margin-right: 0; }
        .stat:nth-child(-n + 3) { border-bottom: 1px solid var(--line); }
        .rule { grid-template-columns: 120px 1fr; }
        .rule .margin { grid-column: 2; }
        .ch-head, .thesis { grid-template-columns: 160px 1fr; }
        .index a { grid-template-columns: 40px 170px 1fr 40px; }
        .index .st { display: none; }
      }
      @media (max-width: 860px) {
        .mast nav a:not(.pill) { display: none; }
        .hero { grid-template-columns: 1fr; padding-top: 44px; gap: 48px; }
        figure.portrait { order: -1; justify-self: start; }
        .ring { width: 200px; margin: 0 0 0 14px; }
        figcaption { text-align: left; }
        .ch-head, .thesis { grid-template-columns: 1fr; gap: 18px; }
        .ch-num { max-width: 220px; }
        .cols { columns: 1; }
        .quote { margin-left: 0.5em; }
        .rule { grid-template-columns: 1fr; gap: 14px; padding: 32px 0; }
        .rule .margin { grid-column: 1; }
        .rule .roman { font-size: 2.4rem; }
        .f-grid { grid-template-columns: 1fr; gap: 28px; }
        .feature.rev .f-text { order: 0; }
        .f-figs { grid-template-columns: 1fr 1fr; gap: 0 20px; }
        .index a { grid-template-columns: 1fr 30px; gap: 8px 12px; padding: 22px 6px; }
        .index .no { display: none; }
        .index .nm { grid-column: 1; }
        .index .go { grid-row: 1; grid-column: 2; }
        .index .tg { grid-column: 1 / -1; }
        .toc-grid { grid-template-columns: 1fr; gap: 44px; }
        .colophon { grid-template-columns: 1fr; gap: 20px; }
        .journey.static .panel { grid-template-columns: 1fr; }
        .journey.static .panel .yr { grid-row: auto; }
        section.chapter { padding-top: 88px; }
        .issue { grid-template-columns: 1fr; gap: 10px; }
      }
      @media (max-width: 1024px) {
        .fig2 { grid-template-columns: 1fr; gap: 40px; padding: 56px 0 72px; }
        .fig2 .txt { max-width: 640px; }
      }
      @media (max-width: 560px) {
        .fig2 figure { margin-inline: -10px; }
        .canvas { padding: 16px 2px 4px; }
        .frame .bar { padding: 12px 14px; }
        .trace { padding: 12px 14px; }
        .trace .nm { display: none; }
        .pipe .node text { font-size: 15.5px; }
        .pipe .node-human text { font-size: 15px; }
        .pipe .node-skip text { font-size: 15px; }
        .pipe .node .num, .pipe .elab { font-size: 13px; }
        .aura i:nth-child(1) { width: 340px; height: 340px; }
        .aura i:nth-child(2) { width: 300px; height: 300px; }
      }
      @media (max-width: 560px) {
        :root { --wrap: min(1240px, 100% - 36px); }
        .topline span:nth-child(3) { display: none; }
        .stats { grid-template-columns: repeat(2, 1fr); }
        .stat { padding: 26px 12px 24px 0; margin-right: 12px; }
        .stat:nth-child(3n) { border-right: 1px solid var(--line); margin-right: 12px; }

        // ---------- Fig. 2: live agent pipeline (ported from variant A, restyled) ----------
        const L = KUCH.lang;
        const story = (function pipeline(host, logEl) {
          const NS = "http://www.w3.org/2000/svg";
          const VBW = 540;
          const N = {
            event: [290, 50, 260, 56],
            checks: [290, 158, 260, 56],
            llm: [290, 266, 260, 56],
            gate: [290, 374, 260, 56],
            human: [104, 468, 196, 50],
            action: [290, 556, 260, 56],
            skip: [490, 158, 88, 40],
          };
          const label = { human: f2.human, skip: f2.skip };
          m.pipeline.forEach((st) => (label[st.id] = st[L]));
          const E = {
            e1: "M290 78 L290 130",
            e2: "M290 186 L290 238",
            eSkip: "M420 158 L446 158",
            e3: "M290 294 L290 346",
            eAuto: "M290 402 L290 528",
            eH1: "M190 402 C 190 426 104 418 104 443",
            eH2: "M104 493 C 104 518 190 506 190 528",
          };
          const ends = { e1: "checks", e2: "llm", eSkip: "skip", e3: "gate", eAuto: "action", eH1: "human", eH2: "action" };
          const order = ["event", "checks", "llm", "gate", "action"];
          let svgs = `<svg class="pipe" viewBox="0 0 ${VBW} 610" aria-hidden="true">`;
          for (const [k, dd] of Object.entries(E)) svgs += `<path class="edge${k.startsWith("eH") ? " h" : ""}" data-e="${k}" d="${dd}"/>`;
          svgs += `<text class="elab" x="302" y="472">${esc(f2.auto)}</text><text class="elab" x="24" y="422">${esc(f2.review)}</text>`;
          for (const [id, [x, y, w, h]] of Object.entries(N)) {
            const r = id === "gate" ? 12 : h / 2;
            const i = order.indexOf(id);
            let inner;
            if (id === "skip") inner = `<text class="lb" x="0" y="4.5" text-anchor="middle">${esc(label[id])}</text>`;
            else {
              const mark = id === "gate" ? `<path class="gem" d="M${-w / 2 + 22} -7 l7 7 -7 7 -7 -7z"/>` : `<circle class="dot" cx="${-w / 2 + 22}" cy="0" r="4"/>`;
              const num = i >= 0 ? `<text class="num" x="${-w / 2 - 12}" y="4" text-anchor="end">0${i + 1}</text>` : "";
              inner = `${mark}<text class="lb" x="${-w / 2 + 38}" y="5">${esc(label[id])}</text>${num}`;
            }
            svgs += `<g class="node node-${id}" data-n="${id}" transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${r}"/>${inner}</g>`;
          }
          svgs += `<g class="packets"></g></svg>`;
          host.innerHTML = svgs;
          const svg = host.querySelector("svg");

          // Labels must fit their pill and stay >= 10px on screen. Shrink first; if that would go
          // under 10px, break the label into two lines instead.
          function fitLabels() {
            const box = svg.getBoundingClientRect();
            const scale = Math.min(box.width / VBW, box.height / 610);
            if (!scale) return;
            svg.querySelectorAll(".node").forEach((g) => {
              const id = g.dataset.n;
              const w = N[id][2];
              const t = g.querySelector("text.lb");
              const x = t.getAttribute("x");
              t.textContent = label[id];
              t.style.fontSize = "";
              const base = parseFloat(getComputedStyle(t).fontSize);
              const room = id === "skip" ? w - 14 : w - 38 - 14;
              const len = t.getComputedTextLength();
              let fs = len > room ? base * (room / len) : base;
              if (fs * scale < 10 && label[id].includes(" ")) {
                const ws = label[id].split(" ");
                let best = null;
                for (let k = 1; k < ws.length; k++) {
                  const a = ws.slice(0, k).join(" ");
                  const b = ws.slice(k).join(" ");
                  const score = Math.max(a.length, b.length);
                  if (!best || score < best.score) best = { a, b, score };
                }
                t.textContent = "";
                const mk = (txt, dy) => {
                  const ts = document.createElementNS(NS, "tspan");
                  ts.setAttribute("x", x);
                  ts.setAttribute("dy", dy);
                  ts.textContent = txt;
                  t.appendChild(ts);
                  return ts;
                };
                const t1 = mk(best.a, "-0.52em");
                const t2 = mk(best.b, "1.12em");
                const longest = Math.max(t1.getComputedTextLength(), t2.getComputedTextLength());
                fs = Math.min(base * 0.94, longest > room ? base * (room / longest) : base);
              }
              t.style.fontSize = fs + "px";
            });
          }
          fitLabels();
          document.fonts && document.fonts.ready.then(fitLabels);
          let rz;
          addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(fitLabels, 120); });

          const pk = svg.querySelector(".packets");
          const paths = {};
          svg.querySelectorAll(".edge").forEach((pp) => (paths[pp.dataset.e] = { el: pp, len: pp.getTotalLength() }));
          const nodes = {};
          svg.querySelectorAll(".node").forEach((g) => (nodes[g.dataset.n] = g));
          const hit = (id) => {
            const g = nodes[id];
            g.classList.add("hit");
            clearTimeout(g._t);
            g._t = setTimeout(() => g.classList.remove("hit"), 420);
          };
          const routes = { skip: ["e1", "eSkip"], auto: ["e1", "e2", "e3", "eAuto"], review: ["e1", "e2", "e3", "eH1", "eH2"] };
          let packets = [];
          let running = false;
          let last = 0;
          let nextSpawn = 0;
          let prevWf = null;
          const stamp = () => new Date().toTimeString().slice(0, 8);
          function spawn() {
            const r = Math.random();
            const kind = r < 0.36 ? "skip" : r < 0.74 ? "auto" : "review";
            let wf = m.workflows[(Math.random() * m.workflows.length) | 0];
            if (wf === prevWf) wf = m.workflows[(m.workflows.indexOf(wf) + 1) % m.workflows.length];
            prevWf = wf;
            const el = document.createElementNS(NS, "circle");
            el.setAttribute("r", 4.5);
            el.setAttribute("cx", 290);
            el.setAttribute("cy", 78);
            pk.appendChild(el);
            packets.push({ kind, wf, seg: 0, d: 0, el, wait: 0, speed: 170 + Math.random() * 50 });
            hit("event");
          }
          function done(p) {
            if (!logEl) return;
            const line = document.createElement("div");
            const verdict = p.kind === "skip" ? f2.skip : p.kind === "auto" ? `gate → ${f2.auto}` : `gate → ${f2.review}`;
            line.innerHTML = `${stamp()}  <b>${p.wf.id.padEnd(3, " ")}</b>  <span class="nm">${esc(p.wf[L])}  </span><span class="k-${p.kind}">${esc(verdict)}</span>`;
            logEl.appendChild(line);
            while (logEl.children.length > 3) logEl.firstChild.remove();
          }
          function place(el, edge, d) {
            const pt = paths[edge].el.getPointAtLength(d);
            el.setAttribute("cx", pt.x.toFixed(1));
            el.setAttribute("cy", pt.y.toFixed(1));
          }
          function frame(t) {
            if (!running) return;
            const dt = Math.min(48, t - (last || t)) / 1000;
            last = t;
            if (t > nextSpawn) {
              spawn();
              nextSpawn = t + 620 + Math.random() * 760;
            }
            for (const p of packets) {
              const segs = routes[p.kind];
              if (p.wait > 0) { p.wait -= dt; continue; }
              p.d += p.speed * dt;
              const cur = paths[segs[p.seg]];
              if (p.d >= cur.len) {
                const end = ends[segs[p.seg]];
                hit(end);
                p.seg++;
                p.d = 0;
                if (end === "gate") p.wait = 0.28;
                if (p.seg >= segs.length) { p.dead = true; p.el.remove(); done(p); continue; }
              }
              p.el.setAttribute("class", "pkt s-" + segs[p.seg]);
              place(p.el, segs[p.seg], p.d);
            }
            packets = packets.filter((p) => !p.dead);
            requestAnimationFrame(frame);
          }
          let visible = false;
          const sync = () => {
            const should = visible && !document.hidden && !reduce;
            if (should && !running) { running = true; last = 0; requestAnimationFrame(frame); }
            else if (!should) running = false;
          };
          new IntersectionObserver(([e]) => { visible = e.isIntersecting; sync(); }).observe(host);
          document.addEventListener("visibilitychange", sync);
          [0, 6, 1].forEach((n, i) => done({ wf: m.workflows[n % m.workflows.length], kind: ["auto", "review", "skip"][i] }));
          if (reduce) {
            // Static frame: a few events frozen mid-route.
            [["e2", 0.5, "e2"], ["eH1", 0.55, "eH1"], ["eSkip", 0.5, "eSkip"], ["eAuto", 0.6, "eAuto"]].forEach(([edge, f, cls]) => {
              const el = document.createElementNS(NS, "circle");
              el.setAttribute("r", 4.5);
              el.setAttribute("class", "pkt s-" + cls);
              pk.appendChild(el);
              place(el, edge, paths[edge].len * f);
            });
          }
          return {
            focus(ids) {
              svg.classList.toggle("focus", !!ids);
              Object.entries(nodes).forEach(([id, g]) => g.classList.toggle("on", !!ids && ids.includes(id)));
            },
          };
        })(document.getElementById("fig2"), document.getElementById("fig2log"));

        // Hovering or focusing a step lights its stage in the figure.
        const focusMap = { gate: ["gate", "human"] };
        document.querySelectorAll("#steps li").forEach((li) => {
          const on = () => story.focus(focusMap[li.dataset.n] || [li.dataset.n]);
          const off = () => story.focus(null);
          li.addEventListener("mouseenter", on);
          li.addEventListener("focus", on);
          li.addEventListener("mouseleave", off);
          li.addEventListener("blur", off);
        });

        // Start the hero choreography after first paint.
        requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add("ready")));

        addEventListener("kuch:theme", () => {
          const e = document.getElementById("edition");
          if (e) e.textContent = edition();
        });

        // Reveal on view (works everywhere; no scroll-timeline dependency).
        const counters = new Set();
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (!e.isIntersecting) return;
              e.target.classList.add("in");
              e.target.querySelectorAll(".count").forEach((n) => counters.add(n) && count(n));
              io.unobserve(e.target);
            });
          },
          { threshold: 0.18, rootMargin: "0px 0px -6% 0px" }
        );
        document.querySelectorAll(".rv, .seq, .rule, .quote").forEach((el) => io.observe(el));

        function count(el) {
          const to = +el.dataset.to;
          if (reduce || to < 3) return;
          const t0 = performance.now();
          const dur = 1500;
          (function tick(now) {
            const p = Math.min(1, (now - t0) / dur);
            el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
            if (p < 1) requestAnimationFrame(tick);
          })(t0);
          el.textContent = "0";
        }

        // Pinned horizontal journey on wide screens; plain stack elsewhere.
        const jSec = document.getElementById("journey");
        const track = jSec.querySelector(".hs-track");
        const jBar = jSec.querySelector(".hs-bar span");
        const progress = document.querySelector(".progress");
        const wide = matchMedia("(min-width: 1024px) and (min-height: 560px) and (pointer: fine)");
        let dist = 0;
        let pinned = false;

        function layout() {
          pinned = wide.matches && !reduce;
          jSec.classList.toggle("static", !pinned);
          if (!pinned) {
            jSec.style.height = "";
            track.style.transform = "";
            return;
          }
          dist = Math.max(0, track.scrollWidth - innerWidth);
          // Shorter pin: the track moves faster than the page scrolls.
          jSec.style.height = `${innerHeight + dist * 0.7}px`;
          onScroll();
        }

        let ticking = false;
        function onScroll() {
          ticking = false;
          const max = document.documentElement.scrollHeight - innerHeight;
          progress.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
          if (!pinned) return;
          const r = jSec.getBoundingClientRect();
          const span = jSec.offsetHeight - (innerHeight - 64);
          const p = Math.min(1, Math.max(0, (64 - r.top) / Math.max(1, span)));
          track.style.transform = `translate3d(${-p * dist}px,0,0)`;
          jBar.style.transform = `scaleX(${p})`;
        }
        addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
        addEventListener("resize", layout);
        wide.addEventListener?.("change", layout);
        document.fonts?.ready.then(layout);
        layout();

        // Marquee pause control (WCAG 2.2.2).
        const mq = document.getElementById("mq");
        const mqBtn = document.getElementById("mq-toggle");
        mqBtn.addEventListener("click", () => {
          const paused = mq.classList.toggle("paused");
          mqBtn.textContent = paused ? d.play : d.pause;
          mqBtn.setAttribute("aria-pressed", paused);
        });
        if (reduce) mqBtn.hidden = true;

        // Copy email.
        const copy = document.getElementById("copy");
        copy.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(m.email); } catch (_) {}
          copy.textContent = c.ui.copied;
          setTimeout(() => (copy.textContent = c.ui.copy), 1800);
        });
      })();
    </script>
  </body>
</html>
