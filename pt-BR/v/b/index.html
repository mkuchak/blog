.focus li:nth-child(1)::before { background: #1b202b; box-shadow: none; }
.focus li:nth-child(2) { --c: var(--purple); }
.focus li:nth-child(3) { --c: var(--blue); }
.focus li:nth-child(4) { --c: var(--ok); }
html.dark .focus li:nth-child(3) { --c: #5b8cff; }
.role-line { margin: 0; font: 500 13px/1.6 var(--mono); color: var(--muted); }
.role-line b { color: var(--fg); font-weight: 600; }
.role-line i { font-style: normal; color: var(--accent-ink); padding: 0 6px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 18px; }
.btn {
  all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 20px; border-radius: 999px;
  font-weight: 600; font-size: 14.5px; transition: background .2s, transform .2s, color .2s, border-color .2s;
}
.btn.primary { background: var(--fg); color: var(--win); }
.btn.primary:hover { background: var(--blue); color: #fff; }
html.dark .btn.primary { background: var(--purple); color: #fff; }
html.dark .btn.primary:hover { background: var(--purple-deep); }
.btn.ghost { border: 1px solid var(--line); background: var(--win); }
.btn.ghost:hover { border-color: var(--accent); }
.btn .ar { transition: transform .25s; }
.btn:hover .ar { transform: translateX(3px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hero-meta { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--faint); font-size: 13.5px; }
.hero-meta li { display: flex; align-items: center; gap: 8px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: pulse 2s infinite; flex: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.avatar { margin: 0; width: 184px; height: 184px; padding: 4px; border-radius: 50%; background: conic-gradient(from var(--ang), var(--yellow), var(--purple), var(--blue), var(--yellow)); animation: spin 9s linear infinite; position: relative; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; display: block; border: 5px solid var(--win); object-fit: cover; background: var(--panel); }
@keyframes spin { to { --ang: 360deg; } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 40px 0 0; }
.spot {
  position: relative; border: 1px solid var(--line); border-radius: 12px; background:
    radial-gradient(360px circle at var(--x, -999px) var(--y, -999px), color-mix(in srgb, var(--accent) 13%, transparent), transparent 45%), var(--panel);
}
html.dark .spot { background: radial-gradient(360px circle at var(--x, -999px) var(--y, -999px), color-mix(in srgb, var(--purple) 22%, transparent), transparent 45%), var(--panel); }
.spot::before {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
  background: radial-gradient(220px circle at var(--x, -999px) var(--y, -999px), var(--accent), transparent 60%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: .8;
}
.stat { padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 4px; }
.stat .num { font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-weight: 600; font-size: 14px; }
.stat small { color: var(--faint); font-size: 12.5px; }
blockquote { margin: 0; padding: 4px 0 4px 22px; border-left: 3px solid var(--accent); }
blockquote p { font-family: var(--serif); font-size: 1.12rem; line-height: 1.75; color: var(--muted); margin: 0 0 12px; max-width: 64ch; text-wrap: pretty; }
blockquote p:first-child { color: var(--fg); font-size: 1.28rem; font-style: italic; }
.thread { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 22px; }
.thread code, .chip {
  font-family: var(--mono); font-size: 12.5px; padding: 5px 10px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); color: var(--muted);
}
.thread code.now { background: var(--yellow); color: #1b202b; border-color: var(--yellow); font-weight: 700; }
.thread .arrow { color: var(--faint); font-family: var(--mono); }
.pn { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line); }
.pn button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); min-width: 0; max-width: 48%; }
.pn button:hover { border-color: var(--accent); }
.pn button:focus-visible { outline: 2px solid var(--accent); }
.pn small { color: var(--faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; }
.pn b { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.pn .nx { text-align: right; margin-left: auto; }
.kick { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); letter-spacing: .04em; margin: 0 0 6px; }

/* ---------- code views ---------- */
.code { font-family: var(--mono); font-size: 13.5px; line-height: 1.75; padding: 20px 0 8px; counter-reset: ln; }
.has-map .code { padding-right: 96px; }
.has-map .runpanel { margin-right: 120px; }
@media (max-width: 1100px) { .has-map .runpanel { margin-right: 56px; } }
.ln { display: grid; grid-template-columns: 58px minmax(0, 1fr); }
.ln .n { color: var(--faint); opacity: .55; text-align: right; padding-right: 20px; user-select: none; font-size: 12px; padding-top: 1px; }
.ln .c { white-space: pre-wrap; word-break: break-word; padding-right: 28px; padding-left: 2ch; text-indent: -2ch; }
.ln:hover .n { opacity: 1; }
.grp { position: relative; border-radius: 6px; transition: background .2s; }
.grp::before { content: ""; position: absolute; left: 44px; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; background: transparent; transition: background .2s; }
.grp:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.grp:hover::before, .grp.flash::before { background: var(--accent); }
.grp.flash { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.t-kw { color: var(--kw); } .t-str { color: var(--str); } .t-cm { color: var(--cm); font-style: italic; } .t-fn { color: var(--fn); }
.t-num { color: var(--num); } .t-ty { color: var(--ty); } .t-pr { color: var(--prop); } .t-pn { color: var(--pn); }
.t-tag { color: var(--kw); font-style: italic; font-weight: 700; } .t-ev { color: var(--accent-ink); font-style: normal; font-weight: 500; }
.t-title { color: var(--str); font-weight: 700; }
.t-cmh { color: var(--fg); font-style: normal; font-weight: 700; }
.t-str a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 3px; }

/* run panel (contact.sh) */
.runpanel { margin: 28px 56px 6px; padding: 28px; border-radius: 16px; position: relative; overflow: hidden; }
.runpanel h1 { font-size: clamp(1.8rem, 3vw, 2.6rem); letter-spacing: -.03em; line-height: 1.1; margin: 0 0 10px; font-weight: 800; text-wrap: balance; }
.runpanel p.kick { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); margin: 0 0 8px; }
.runpanel p:not(.kick) { font-family: var(--serif); color: var(--muted); font-size: 1.08rem; line-height: 1.7; margin: 0 0 20px; max-width: 58ch; }
.runpanel .cta { margin: 0; }
.glow {
  border: 1px solid transparent;
  background: linear-gradient(var(--panel), var(--panel)) padding-box, conic-gradient(from var(--ang), transparent 65%, var(--yellow), var(--purple), transparent) border-box;
  animation: spin 5s linear infinite;
}

/* journey.log */
.log { font-family: var(--mono); font-size: 13px; padding: 22px 28px 40px; max-width: 1020px; }
.log .cmd { color: var(--faint); margin-bottom: 18px; }
.log .cmd b { color: var(--ok); font-weight: 500; }
.log h3 { font-family: var(--sans); font-size: clamp(1.5rem, 2.4vw, 2rem); letter-spacing: -.025em; margin: 0 0 22px; }
.entry {
  display: grid; grid-template-columns: 120px 104px minmax(0, 1fr); gap: 4px 16px; padding: 14px 14px; border-radius: 10px;
  border-left: 2px solid var(--line); margin-left: 2px; opacity: 0; transform: translateY(6px); animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * 70ms);
}
@keyframes rise { to { opacity: 1; transform: none; } }
.entry:hover { background: var(--panel); }
.entry .yr { color: var(--faint); white-space: nowrap; }
.entry .lv { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 5px; height: fit-content; width: fit-content; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.entry .who { color: var(--fg); font-weight: 700; }
.entry .who span { color: var(--muted); font-weight: 400; }
.entry .st { grid-column: 3; font-family: var(--serif); color: var(--muted); font-size: 14.5px; line-height: 1.65; max-width: 70ch; }
.entry .st::before { content: "└─ "; font-family: var(--mono); color: var(--faint); }
.entry.cur { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.entry.cur .lv { background: var(--yellow); color: #1b202b; border-color: var(--yellow); }
.entry .now { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; color: var(--ok); font-weight: 500; font-size: 12px; }
.caret { display: inline-block; width: .6em; height: 1.1em; vertical-align: -2px; background: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* directories */
.lsl { font-family: var(--mono); font-size: 13px; margin: 18px 0 26px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lsl .r { display: grid; grid-template-columns: 96px 110px 170px minmax(0, 1fr); gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); align-items: baseline; cursor: pointer; }
.lsl .r:first-child { border-top: 0; }
.lsl .r:hover, .lsl .r.on { background: var(--panel); }
.lsl .p { color: var(--faint); } .lsl .s { color: var(--muted); } .lsl .nm { color: var(--accent-ink); font-weight: 700; } .lsl .d { color: var(--muted); font-family: var(--sans); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { padding: 20px; display: flex; flex-direction: column; gap: 8px; scroll-margin: 24px; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card .nm { font-family: var(--mono); font-weight: 700; color: var(--accent-ink); font-size: 14px; }
.card .stt { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.card h4 { margin: 0; font-size: 1.06rem; letter-spacing: -.01em; }
.card p { margin: 0; font-family: var(--serif); color: var(--muted); font-size: 14.5px; line-height: 1.65; }
.card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 8px; }
.card .chip { font-size: 11.5px; padding: 3px 8px; }
.card a.go { font-family: var(--mono); font-size: 12px; }
.card.hit { animation: hit 2.4s ease; }
@keyframes hit { 0%, 60% { box-shadow: 0 0 0 2px var(--accent), 0 0 40px -6px var(--accent); } 100% { box-shadow: none; } }

/* work */
.wl { margin-top: 18px; display: grid; gap: 10px; }
.wr { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 20px; padding: 18px 20px; }
.wr:focus-visible { outline: 2px solid var(--accent); }
.wr .f { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.wr h4 { margin: 2px 0 0; font-size: 1.12rem; letter-spacing: -.01em; }
.wr .o { color: var(--muted); font-size: 13px; }
.wr .m { grid-row: 1 / span 3; grid-column: 2; align-self: center; text-align: right; }
.wr .m b { display: block; font-size: 1.35rem; letter-spacing: -.02em; color: var(--accent-ink); font-weight: 800; }
html.dark .wr .m b { color: var(--yellow); }
.wr .m small { color: var(--faint); font-size: 12px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 26px 0 8px; }
.metric { padding: 18px; }
.metric b { display: block; font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
html.dark .metric b { color: var(--yellow); }
.metric span { color: var(--muted); font-size: 13px; }
.checks { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 10px; }
.checks li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-family: var(--serif); font-size: 1.02rem; line-height: 1.65; color: var(--muted); }
.checks li::before { content: "✓"; font-family: var(--mono); font-weight: 700; color: #1b202b; background: var(--yellow); width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; margin-top: 4px; }
.stackrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }

/* pipeline diagram */
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 26px 0 6px; }
.node { position: relative; padding: 14px 12px; margin-right: 26px; font-size: 12.5px; }
.node:last-child { margin-right: 0; }
.node b { display: block; font-size: 13px; margin-bottom: 4px; }
.node small { color: var(--faint); line-height: 1.45; display: block; }
.node .idx { font-family: var(--mono); font-size: 11px; color: var(--accent-ink); }
.node:not(:last-child)::after {
  content: ""; position: absolute; top: 28px; right: -26px; width: 26px; height: 2px;
  background: linear-gradient(90deg, var(--line), var(--accent), var(--line)); background-size: 200% 100%; animation: flow 1.6s linear infinite;
}
@keyframes flow { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.node.gate { box-shadow: 0 0 0 1px var(--accent) inset; }
.toolgrid { display: grid; grid-template-columns: repeat(30, 1fr); gap: 4px; margin: 22px 0 4px; max-width: 520px; }
.toolgrid i { aspect-ratio: 1; border-radius: 2px; background: var(--line); animation: lit 3.2s ease-in-out infinite; animation-delay: calc(var(--d) * 1ms); }
@keyframes lit { 0%, 70%, 100% { background: var(--line); } 80% { background: var(--accent); } }
.caption { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }

/* writing */
.sc { margin-top: 20px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sc h5 { margin: 0; padding: 10px 16px; background: var(--panel); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; }
.sc h5 span { font-family: var(--mono); background: var(--win); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.wrow { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); scroll-margin: 24px; }
.wrow:hover, .wrow.on { background: var(--panel); }
.wrow .ic { width: 12px; height: 12px; border-radius: 50%; background: var(--purple); justify-self: center; }
.wrow.draft .ic { background: transparent; border: 2px dashed var(--faint); }
.wrow .t { font-weight: 600; font-size: 15px; letter-spacing: -.005em; }
.wrow.draft .t { color: var(--muted); font-weight: 500; }
.wrow .meta { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--faint); }
.wrow .meta .chip { font-size: 11px; padding: 2px 7px; }
.wrow .wst { font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; }
.wrow.draft .wst { color: var(--accent-ink); }
.shimmer { height: 4px; width: 90px; border-radius: 4px; background: linear-gradient(90deg, var(--line) 0 30%, var(--accent) 50%, var(--line) 70% 100%) 0 0 / 300% 100%; animation: sh 2.4s linear infinite; }
@keyframes sh { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* ---------- terminal ---------- */
.term { display: flex; flex-direction: column; height: var(--term-h); border-top: 1px solid var(--line); background: var(--panel2); min-height: 0; position: relative; transition: height .3s cubic-bezier(.2,.8,.2,1); }
.term.dragging { transition: none; }
.term.closed { height: 34px; }
.term .grip { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: ns-resize; z-index: 2; }
.th { display: flex; align-items: center; gap: 14px; height: 34px; padding: 0 8px 0 16px; flex: none; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; user-select: none; }
.th .tt { color: var(--fg); position: relative; padding: 9px 0; }
.th .tt::after { content: ""; position: absolute; left: 0; right: 0; bottom: 3px; height: 1px; background: var(--accent); }
.th .sess { display: inline-flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-family: var(--mono); font-weight: 500; font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: var(--win); border: 1px solid var(--line); color: var(--muted); }
.th .sp { flex: 1; }
.term.closed .tbody { display: none; }
.term.closed .chev svg { transform: rotate(180deg); }
.tbody { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.tout { flex: 1; overflow: auto; padding: 14px 18px 6px; font-family: var(--mono); font-size: 13px; line-height: 1.65; -webkit-mask-image: linear-gradient(transparent, #000 22px); mask-image: linear-gradient(transparent, #000 22px); }
.blk { margin-bottom: 10px; }
.echo { color: var(--fg); }
.echo .ps, .prompt .ps { color: var(--accent-ink); font-weight: 700; }
html.dark .echo .ps, html.dark .prompt .ps { color: var(--yellow); }
.out { white-space: pre-wrap; word-break: break-word; color: var(--muted); }
.o-y { color: var(--accent-ink); font-weight: 700; } html.dark .o-y { color: var(--yellow); }
.o-b { color: var(--fg); font-weight: 700; }
.o-m { color: var(--faint); }
.o-g { color: var(--ok); }
.o-p { color: var(--kw); font-weight: 600; }
.o-e { color: #e5484d; }
.out a { color: var(--link); }
.out .cmdlink { all: unset; cursor: pointer; color: var(--kw); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
.out .cmdlink:focus-visible { outline: 1px solid var(--accent); }
.spin { color: var(--faint); }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 18px 4px; flex: none; }
.sugg::-webkit-scrollbar { display: none; }
.sugg button {
  all: unset; cursor: pointer; flex: none; font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--win); color: var(--muted); transition: border-color .2s, color .2s, transform .2s;
}
.sugg button:hover { border-color: var(--accent); color: var(--fg); transform: translateY(-1px); }
.sugg button:focus-visible { outline: 2px solid var(--accent); }
.prompt { display: flex; align-items: center; gap: 8px; padding: 6px 18px 12px; font-family: var(--mono); font-size: 13px; flex: none; }
.prompt .u { color: var(--kw); } .prompt .h { color: var(--faint); }
.prompt input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; caret-color: var(--accent); }
.prompt input::placeholder { color: var(--faint); opacity: .7; }

/* status bar */
.status {
  display: flex; align-items: center; gap: 2px; padding: 0 6px; font-size: 11.5px; background: var(--fg); color: var(--win);
  font-family: var(--mono); white-space: nowrap; overflow: hidden; position: relative;
}
html.dark .status { background: var(--purple); color: #fff; }
.status .it { all: unset; cursor: default; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; height: 28px; }
.status button.it { cursor: pointer; }
.status button.it:hover { background: rgba(255,255,255,.14); }
.status button.it:focus-visible { outline: 1px solid var(--yellow); outline-offset: -2px; }
.status .sp { flex: 1; }
.status .gd { width: 7px; height: 7px; border-radius: 50%; background: #35d07f; box-shadow: 0 0 0 0 rgba(53,208,127,.7); animation: pulse 2s infinite; }
.status .y { color: var(--yellow); }
.wfpop {
  position: absolute; left: 0; bottom: 34px; z-index: 6; width: min(380px, calc(100% - 24px)); margin-left: 12px; padding: 12px; border-radius: 12px;
  background: var(--win); border: 1px solid var(--line); box-shadow: 0 20px 60px -20px rgba(0,0,0,.5); font-size: 12.5px; display: none;
}
.wfpop.open { display: block; animation: tabIn .25s ease; }
.wfpop h6 { margin: 2px 4px 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.wfpop ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; max-height: 300px; overflow: auto; }
.wfpop li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; }
.wfpop li:hover { background: var(--panel); }
.wfpop li b { font-family: var(--mono); font-size: 11.5px; color: var(--accent-ink); }
.wfpop li small { color: var(--faint); font-family: var(--mono); font-size: 10.5px; display: flex; align-items: center; gap: 6px; }
.wfpop li small i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

/* ---------- command palette ---------- */
dialog.pal {
  border: 0; padding: 0; width: min(640px, calc(100vw - 24px)); margin: 11vh auto auto; border-radius: 14px; background: var(--win); color: var(--fg);
  box-shadow: 0 40px 100px -20px rgba(0,0,0,.55), 0 0 0 1px var(--line); overflow: hidden;
  opacity: 1; transform: none;
  transition: opacity .18s ease, transform .22s cubic-bezier(.2,.8,.2,1), overlay .22s allow-discrete, display .22s allow-discrete;
}
dialog.pal:not([open]) { opacity: 0; transform: translateY(-10px) scale(.98); }
@starting-style { dialog.pal[open] { opacity: 0; transform: translateY(-10px) scale(.98); } }
dialog.pal::backdrop { background: rgba(15,14,20,.42); backdrop-filter: blur(3px); }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.pal-in svg { width: 18px; height: 18px; color: var(--faint); flex: none; }
.pal-in input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--fg); font: 500 16px var(--sans); min-width: 0; }
.pal-list { list-style: none; margin: 0; padding: 6px; max-height: min(420px, 55vh); overflow: auto; }
.pal-list .grp-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 10px 10px 4px; font-weight: 600; }
.pal-list .opt { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.pal-list .opt small { margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: 11.5px; line-height: 1.35; text-align: right; max-width: 50%; }
.pal-list .opt[aria-selected="true"] { background: var(--active); box-shadow: inset 2px 0 0 var(--accent); }
.pal-list .empty { padding: 18px; color: var(--faint); text-align: center; }
.pal-foot { display: flex; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); background: var(--panel); }

.toast { position: fixed; left: 50%; bottom: calc(var(--switcher-space) + 50px); transform: translate(-50%, 10px); opacity: 0; z-index: 20; background: var(--fg); color: var(--win); font: 600 13px var(--sans); padding: 9px 14px; border-radius: 999px; transition: .25s; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {

}
@media (max-width: 900px) {

}
@media (max-width: 768px) {

  .main.drawer .explorer { transform: none; }

}
@media (max-width: 860px) {

}

<script>
(() => {
  const c = KUCH.content();

  /* ---------------- icons ---------------- */

    linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.6c0-1.34-.03-3.06-1.86-3.06-1.87 0-2.15 1.46-2.15 2.96V21H9z"/></svg>',

  /* ---------------- views ---------------- */

  const VIEWS = {

    if (line) out.push(line);

    const h = c.hero, th = c.thesis;

    const t0 = performance.now(), dur = 1300;
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      el.textContent = pre + Math.round(to * e) + suf;
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function drawMinimap() {
    const cv = $("#mapc"), box = $("#minimap");
    if (!viewwrap.classList.contains("has-map") || getComputedStyle(box).display === "none") return;
    const lines = [...view.querySelectorAll(".ln .c")];
    const h = box.clientHeight, w = box.clientWidth, dpr = Math.min(devicePixelRatio || 1, 2);
    const lh = Math.max(2, Math.min(4, (h - 20) / Math.max(lines.length, 1)));
    cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + "px";
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
    const cs = getComputedStyle(document.documentElement);
    lines.forEach((ln, i) => {
      let x = 10;
      ln.querySelectorAll("span").forEach((sp) => {
        if (sp.querySelector("span")) return;
        const len = sp.textContent.replace(/\s+$/, "").length;
        const lead = sp.textContent.length - sp.textContent.trimStart().length;
        x += lead * 0.9;
        const cls = (sp.className.match(/t-(\w+)/) || [])[1] || "pr";
        const map = { cm: "--cm", kw: "--kw", str: "--str", fn: "--fn", ty: "--ty", pr: "--prop", pn: "--pn", tag: "--kw", ev: "--str", title: "--str", cmh: "--fg", num: "--num" };
        ctx.fillStyle = cs.getPropertyValue(map[cls] || "--muted").trim() || "#888";
        ctx.globalAlpha = cls === "cm" ? 0.45 : 0.8;
        const tw = Math.min(len * 0.9, w - x - 6);
        if (tw > 0) ctx.fillRect(x, 10 + i * lh, tw, Math.max(1, lh - 1));
        x += len * 0.9 + 0.9;
      });
    });
    const upd = () => {
      const vp = $("#mapvp"), total = lines.length * lh;
      const ratio = view.clientHeight / view.scrollHeight;
      vp.style.height = Math.max(20, total * ratio) + "px";
      vp.style.top = 10 + (view.scrollTop / Math.max(1, view.scrollHeight - view.clientHeight)) * Math.max(0, total - total * ratio) + "px";
    };
    upd();
    view.onscroll = upd;
  }

      const v = tin.value, parts = v.split(/\s+/);
      const pool = parts.length > 1 ? [...ROOT, ...caseIds.map((x) => "work/" + x + ".md"), ...c.oss.map((o) => o.name)] : COMMANDS;
      const last = parts[parts.length - 1];
      const m = pool.filter((p) => p.toLowerCase().startsWith(last.toLowerCase()));
      if (m.length === 1) { parts[parts.length - 1] = m[0]; tin.value = parts.join(" ") + (parts.length === 1 ? " " : ""); }
      else if (m.length > 1) runCommandEcho(m.join("   "));
    } else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); tout.innerHTML = ""; }
    else if (e.key === "Escape") tin.blur();
  });
  function runCommandEcho(text) {
    const d = document.createElement("div"); d.className = "out o-m"; d.textContent = text; tout.append(d); tout.scrollTop = tout.scrollHeight;
  }
  const SUGG = ["whoami", "cat principles.ts", "ls work/", "open termx", "stats", "contact", "help"];
  $("#sugg").innerHTML = SUGG.map((s) => `<button data-sugg="${esc(s)}">${esc(s)}</button>`).join("");

  /* ---------------- boot ---------------- */
  const banner = document.createElement("div");
  banner.className = "out o-m"; banner.style.marginBottom = "10px";
  banner.textContent = L.banner;
  tout.append(banner);

  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (VIEWS[h]) return { id: h, hl: null };
    if (h.startsWith("oss/") && c.oss.some((o) => o.name === h.slice(4))) return { id: "oss", hl: h.slice(4) };
    if (h.startsWith("writing/") && writingSlugs.includes(h.slice(8))) return { id: "writing", hl: h.slice(8) };
    return { id: "readme", hl: null };
  }
  addEventListener("hashchange", () => { const r = fromHash(); openView(r.id, { hl: r.hl }); });
  const boot = fromHash();
  openView(boot.id, { hl: boot.hl, animate: false });
  setTerm(!matchMedia("(max-width: 768px)").matches);
  setTimeout(() => runCommand("whoami"), reduce ? 0 : 900);
})();
</script>
</body>
</html>
