        height: calc(3 * 1.6em + 2 * 4px + 24px); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
      .log div { flex: none; white-space: nowrap; animation: logIn 0.4s var(--ease); }
      @media (max-width: 560px) { .log .nm { display: none; } }
      .log .k-auto { color: var(--accent-text); }
      .log .k-review { color: var(--yellow-ink); }
      @keyframes logIn { from { opacity: 0; transform: translateY(6px); } }

      /* pipeline svg */
      svg.pipe { width: 100%; height: auto; display: block; overflow: visible; }
      .pipe .edge { fill: none; stroke: var(--line-2); stroke-width: 1.4; stroke-dasharray: 3 5; }
      html.js .pipe .edge { animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      .pipe .node { transition: opacity 0.4s; }
      .pipe .node rect { fill: var(--card-2); stroke: var(--line-2); stroke-width: 1.2; transition: stroke 0.3s, fill 0.3s; }
      .pipe .node text { fill: var(--text); font: 600 15px var(--sans); letter-spacing: -0.01em; }
      .pipe .node .dot { fill: var(--faint); transition: fill 0.3s; }
      .pipe .node .num { fill: var(--faint); font: 500 10px var(--mono); }
      .pipe .gem { fill: var(--yellow); }
      .pipe .node-gate rect { stroke: color-mix(in srgb, var(--yellow) 55%, var(--line-2)); }
      .pipe .node-skip rect, .pipe .node-human rect { fill: transparent; stroke-dasharray: 3 4; }
      .pipe .node-skip text { font-size: 12px; fill: var(--faint); font-family: var(--mono); font-weight: 500; }
      .pipe .node-human text { font-size: 13.5px; }
      .pipe .node.hit rect { stroke: var(--hot); fill: color-mix(in srgb, var(--hot) 14%, var(--card-2)); }
      .pipe .node.hit .dot { fill: var(--hot); }
      .pipe .node-human.hit rect, .pipe .node-gate.hit rect { stroke: var(--yellow); fill: color-mix(in srgb, var(--yellow) 12%, var(--card-2)); }
      .pipe .elab { fill: var(--faint); font: 500 10.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
      .pipe .pkt { fill: var(--text); filter: drop-shadow(0 0 5px currentColor); color: var(--text); }
      .pipe .pkt.s-e3, .pipe .pkt.s-eAuto { fill: var(--hot); color: var(--hot); }
      .pipe .pkt.s-eH1, .pipe .pkt.s-eH2 { fill: var(--yellow); color: var(--yellow); }
      .pipe .pkt.s-eSkip { fill: var(--faint); color: transparent; }
      .pipe.focus .node:not(.on) { opacity: 0.28; }
      .pipe.focus .node.on rect { stroke: var(--yellow); stroke-width: 1.6; fill: color-mix(in srgb, var(--yellow) 14%, var(--card-2)); }
      .pipe.focus .node.on .dot { fill: var(--yellow); }

      /* in this issue */
      .issue { display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: baseline; border-top: 1px solid var(--text); padding: 16px 0; }
      .dark .issue { border-top-color: color-mix(in srgb, var(--text) 50%, transparent); }
      .issue h2 { margin: 0; font: 600 0.72rem var(--mono); letter-spacing: 0.16em; text-transform: uppercase; }
      .issue ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 28px; }
      .issue a { font-family: var(--serif); color: var(--muted); font-size: 0.98rem; transition: color 0.2s; }
      .issue a:hover { color: var(--text); }
      .issue a span { font: 600 0.72rem var(--mono); color: var(--yellow-ink); margin-right: 6px; }
      .issue .ed { font: 600 0.7rem var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }

      /* chapter heads */
      .ch-head { display: grid; grid-template-columns: 220px 1fr; gap: 40px; margin-bottom: 64px; align-items: start; }
      .ch-num { font: 600 0.74rem/1.6 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); border-top: 2px solid var(--text); padding-top: 12px; }
      .ch-num b { display: block; font: 400 2.1rem/1.15 var(--script); color: var(--yellow); letter-spacing: 0; text-transform: none; margin-top: 8px;
        transform: rotate(-3deg); transform-origin: 0 50%; }
      .ch-head .h2 { margin-top: 0; }
      .ch-head .lede { margin-top: 20px; }

      /* highlighter sweep */
      .mk { background-image: linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 92%, transparent 92%); background-repeat: no-repeat; background-size: 100% 100%;
        -webkit-box-decoration-break: clone; box-decoration-break: clone; }
      html.js .mk { background-size: 0% 100%; transition: background-size 1.1s var(--ease) 0.25s; }
      html.js .in .mk, html.js .mk.in, html.js .step.on .mk { background-size: 100% 100%; }

      /* stats */
      .stats { border-block: 1px solid var(--line); background: var(--bg-soft); }
      .stats .wrap { display: grid; grid-template-columns: repeat(6, 1fr); }
      .stat { padding: 34px 22px; border-left: 1px solid var(--line); }
      .stat:first-child { border-left: 0; padding-left: 0; }
      .stat .n { font-size: clamp(2rem, 3.2vw, 2.8rem); font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
      .stat .n em { font-style: normal; color: var(--yellow-ink); }
      .stat .l { margin-top: 12px; font-weight: 600; font-size: 0.92rem; line-height: 1.3; }
      .stat .t { margin-top: 6px; font-family: var(--mono); font-size: 0.72rem; color: var(--faint); }

      /* thesis */
      .thesis .h2 { font-size: clamp(2.2rem, 4.6vw, 3.9rem); }
      .th-grid { display: grid; grid-template-columns: 220px 1fr; gap: 40px; }
      .quote { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(1.9rem, 3.8vw, 3.3rem); line-height: 1.16; letter-spacing: -0.02em;
        margin: 0 0 48px; text-wrap: balance; position: relative; color: var(--text); }
      .quote::before { content: "\201C"; position: absolute; left: -0.55em; top: -0.12em; color: var(--yellow); font-size: 1.6em; line-height: 1; }
      .cols { columns: 2; column-gap: 48px; font-family: var(--serif); font-size: 1.16rem; line-height: 1.8; color: var(--muted); }
      .cols p { margin: 0 0 1.1em; break-inside: avoid-column; }
      .cols p:first-child::first-letter { float: left; font-weight: 600; color: var(--text); font-size: 4.6em; line-height: 0.82; padding: 0.08em 0.12em 0 0; margin-top: 0.04em; }
      .chain { margin-top: 72px; position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .chain .rail { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); }
      .chain .rail b { position: absolute; inset: 0; background: linear-gradient(90deg, var(--faint), var(--hot), var(--yellow)); transform-origin: 0 50%; transform: scaleX(0); transition: transform 2s var(--ease); }
      .chain.in .rail b { transform: scaleX(1); }
      .chain .chip { position: relative; z-index: 1; padding: 12px 20px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg);
        font-family: var(--mono); font-size: 0.86rem; color: var(--faint); transition: all 0.5s var(--ease); transition-delay: calc(var(--i) * 300ms + 200ms); }
      .chain.in .chip { color: var(--text); border-color: var(--faint); }
      .chain .chip:last-child { font-weight: 600; }
      .chain.in .chip:last-child { background: var(--yellow); border-color: var(--yellow); color: #1b202b; box-shadow: 0 0 40px -6px var(--yellow); }
      .chain .yr { position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: var(--faint); white-space: nowrap; }

      /* principles: sticky story */
      .story { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start; }
      .stage { position: sticky; top: 92px; height: calc(100svh - 124px); max-height: 760px; display: flex; flex-direction: column; border: 1px solid var(--line);
        border-radius: 24px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
      .stage .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 0.74rem; color: var(--faint); }
      .stage .bar b { color: var(--text); font-weight: 600; }
      .stage .diagram { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px 22px; }
      .stage .diagram svg { max-height: 100%; width: auto; max-width: 100%; }
      .stage .foot { border-top: 1px solid var(--line); padding: 16px 20px; min-height: 84px; }
      .stage .foot .lab { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
      .stage .foot .ev { margin-top: 6px; font-weight: 600; font-size: 0.98rem; color: var(--text); }
      .steps { display: flex; flex-direction: column; }
      .step { min-height: 64svh; display: flex; flex-direction: column; justify-content: center; padding: 24px 0; opacity: 0.34; transition: opacity 0.5s var(--ease); }
      .step.on { opacity: 1; }
      .step:first-child { min-height: 46svh; justify-content: flex-start; }
      .step .roman { font: italic 400 3rem/1 var(--serif); color: var(--text); opacity: 0.22; transition: opacity 0.5s, color 0.5s; }
      .step.on .roman { opacity: 1; color: var(--yellow); }
      .step h3 { font-size: clamp(1.6rem, 2.5vw, 2.2rem); letter-spacing: -0.03em; line-height: 1.15; margin: 14px 0 16px; font-weight: 800; text-wrap: balance; }
      .step p { font-family: var(--serif); font-size: 1.18rem; line-height: 1.75; color: var(--muted); margin: 0; max-width: 33em; }
      .step p sup { font: 600 0.65rem var(--mono); color: var(--yellow-ink); margin-left: 3px; }
      .note { margin-top: 24px; font: 400 0.84rem/1.6 var(--mono); color: var(--muted); border-left: 2px solid var(--yellow); padding: 2px 0 2px 14px; max-width: 33em; }
      .note b { display: block; color: var(--yellow-ink); font-weight: 600; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }

      /* bento cases */
      .bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
      .tile { --x: 50%; --y: 50%; position: relative; grid-column: span 3; border-radius: 22px; border: 1px solid var(--line); background: var(--card);
        padding: 30px; display: flex; flex-direction: column; overflow: hidden; isolation: isolate; }
      .tile::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity 0.4s;
        background: radial-gradient(520px circle at var(--x) var(--y), color-mix(in srgb, var(--hot) 7%, transparent), transparent 45%); }
      .bento:hover .tile::before { opacity: 1; }
      .tile.big { grid-column: span 4; grid-row: span 2; }
      .tile.tall { grid-column: span 2; grid-row: span 2; }
      .tile.big { border: 1px solid transparent;
        background: linear-gradient(var(--card), var(--card)) padding-box,
          conic-gradient(from var(--ang), var(--line) 0 62%, color-mix(in srgb, var(--hot) 65%, var(--line)) 76%, color-mix(in srgb, var(--yellow) 55%, var(--line)) 84%, var(--line) 92%) border-box; }
      html.js .tile.big { animation: spin 12s linear infinite; }
      @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
      @keyframes spin { to { --ang: 360deg; } }
      .tile .org { font-family: var(--mono); font-size: 0.74rem; color: var(--faint); display: flex; justify-content: space-between; gap: 12px; letter-spacing: 0.04em; }
      .tile .org b { color: var(--yellow-ink); font-weight: 500; }
      .tile h3 { font-size: 1.45rem; line-height: 1.15; letter-spacing: -0.025em; margin: 16px 0 12px; font-weight: 750; text-wrap: balance; }
      .tile.big h3 { font-size: clamp(1.8rem, 2.6vw, 2.3rem); max-width: 620px; }
      .tile .sum { font-family: var(--serif); color: var(--muted); line-height: 1.65; margin: 0; font-size: 1rem; }
      .tile.big .sum { font-size: 1.1rem; max-width: 640px; }
      .tile ul { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
      .tile li { position: relative; padding-left: 20px; font-size: 0.92rem; line-height: 1.5; color: var(--muted); }
      .tile li::before { content: ""; position: absolute; left: 2px; top: 0.66em; width: 8px; height: 2px; border-radius: 2px; background: var(--yellow-ink); }
      .wfs { margin-top: 26px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg-soft); padding: 14px 16px; }
      .wfs .lg { display: flex; gap: 16px; font-family: var(--mono); font-size: 0.68rem; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
      .wfs .lg span { display: inline-flex; align-items: center; gap: 6px; }
      .wfs ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 22px; }
      .wfs li { padding: 0; font-family: var(--mono); font-size: 0.74rem; line-height: 1.45; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
      .wfs li i { align-self: center; }
      .wfs li::before { display: none; }
      .wfs li b { color: var(--text); font-weight: 600; min-width: 26px; flex: none; }
      .wfs i { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--hot); }
      .wfs .re i, .wfs i.re { background: var(--yellow); }
      html.js .wfs li i { animation: beat 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * 230ms); }
      @keyframes beat { 0%, 70%, 100% { opacity: 0.35; transform: scale(0.8); } 80% { opacity: 1; transform: scale(1.35); } }
      .tile.big > ul { grid-template-columns: 1fr 1fr; gap: 12px 28px; }
      .metrics { display: flex; flex-wrap: wrap; gap: 18px 40px; margin-top: auto; padding-top: 30px; }
      .metric { min-width: 0; }
      .metric .v { font-size: clamp(2.3rem, 3.4vw, 3rem); font-weight: 850; letter-spacing: -0.05em; line-height: 0.95; font-variant-numeric: tabular-nums; }
      .metric .v.long { font-size: clamp(1.7rem, 2.4vw, 2.2rem); letter-spacing: -0.04em; }
      .tile.big .metric .v { font-size: clamp(3rem, 5.2vw, 4.6rem); }
      .tile.big .metric .v.long { font-size: clamp(2rem, 3.2vw, 2.8rem); }
      .metric .v .to { color: var(--yellow); font-weight: 500; }
      .metric .ml { font-family: var(--serif); font-style: italic; font-size: 0.96rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
      .tag { font-family: var(--mono); font-size: 0.7rem; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--bg-soft); }

      /* journey: pinned horizontal on desktop, chapters list elsewhere */
      .journey { position: relative; }
      .journey.static { padding: 120px 0 40px; }
      .hs-sticky { position: sticky; top: 68px; height: calc(100vh - 68px); height: calc(100dvh - 68px); overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
      .hs-head { width: var(--wrap); margin: 0 auto 36px; display: flex; justify-content: space-between; align-items: end; gap: 24px; }
      .hs-head .ch-head { margin: 0; flex: 1; }
      .hint { font: 600 0.74rem var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
      .hint span { display: inline-block; animation: nudge 1.8s var(--ease) infinite; }
      @keyframes nudge { 50% { transform: translateX(6px); } }
      .hs-track { display: flex; width: max-content; padding-left: calc((100vw - min(1240px, 100vw - 48px)) / 2); padding-right: 12vw; will-change: transform; }
      .panel { width: min(380px, 34vw); padding-right: 34px; margin-right: 34px; border-right: 1px solid var(--line); flex: none; }
      .panel:last-child { border-right: 0; }
      .yr { font-weight: 900; font-size: clamp(4.2rem, 8vw, 7.2rem); line-height: 0.85; letter-spacing: -0.06em; color: color-mix(in srgb, var(--text) 10%, var(--bg));
        margin-bottom: 22px; transition: color 0.5s; }
      .panel:hover .yr { color: color-mix(in srgb, var(--text) 22%, var(--bg)); }
      .panel.now .yr, .panel.now:hover .yr { color: var(--yellow); }
      .dark .panel.now .yr { text-shadow: 0 0 40px color-mix(in srgb, var(--yellow) 35%, transparent); }
      .range { font: 600 0.74rem var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); display: flex; gap: 10px; align-items: center; }
      .range i { width: 7px; height: 7px; border-radius: 50%; background: var(--hot); display: inline-block; flex: none; }
      .panel.now .range i { background: var(--yellow); box-shadow: 0 0 0 4px color-mix(in srgb, var(--yellow) 22%, transparent); }
      .panel h3 { font-weight: 850; font-size: 2rem; letter-spacing: -0.035em; margin: 12px 0 4px; }
      .panel .rl { font-family: var(--serif); font-style: italic; color: var(--text); font-size: 1.08rem; }
      .panel .pl { font: 400 0.76rem var(--mono); color: var(--faint); margin-top: 4px; }
      .panel p { font-family: var(--serif); color: var(--muted); font-size: 1.04rem; line-height: 1.72; margin: 18px 0 0; }
      .hs-bar { width: var(--wrap); margin: 44px auto 0; height: 3px; border-radius: 3px; background: var(--line); position: relative; }
      .hs-bar span { position: absolute; inset: 0; border-radius: 3px; background: linear-gradient(90deg, var(--hot), var(--yellow)); transform-origin: 0 50%; transform: scaleX(0); }
      .hs-ends { width: var(--wrap); margin: 12px auto 0; display: flex; justify-content: space-between; font: 600 0.72rem var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
      .journey.static .hs-sticky { position: static; height: auto; overflow: visible; display: block; }
      .journey.static .hs-head { margin-bottom: 0; }
      .journey.static .hs-head .ch-head { margin-bottom: 48px; }
      .journey.static .hs-track { width: var(--wrap); margin: 0 auto; padding: 0; flex-direction: column; transform: none !important; }
      .journey.static .panel { width: auto; margin: 0; padding: 36px 0; border-right: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 0.9fr) 1.1fr; gap: 0 40px; }
      .journey.static .panel .yr { grid-row: span 6; font-size: clamp(4rem, 10vw, 7.5rem); }
      .journey.static .hs-bar, .journey.static .hint, .journey.static .hs-ends { display: none; }

      /* open source index */
      .index { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--text); }
      .dark .index { border-top-color: color-mix(in srgb, var(--text) 50%, transparent); }
      .index a { display: grid; grid-template-columns: 56px 220px 1fr 150px 40px; gap: 24px; align-items: baseline; padding: 26px 12px; border-bottom: 1px solid var(--line);
        transition: background-color 0.3s, padding 0.4s var(--ease); }
      .index a:hover { background: var(--card-2); padding-left: 22px; }
      .index .no { font: 600 0.74rem var(--mono); color: var(--faint); }
      .index .nm { font: 600 1.25rem var(--mono); letter-spacing: -0.02em; }
      .index a:hover .nm { box-shadow: inset 0 -0.35em 0 var(--hl); }
      .index .tg { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; }
      .index .dt { display: block; color: var(--muted); font-size: 0.95rem; margin-top: 6px; line-height: 1.6; }
      .index .tags { margin-top: 12px; }
      .index .st { font: 500 0.78rem var(--mono); color: var(--faint); text-align: right; }
      .index .go { font-size: 1.3rem; justify-self: end; transition: transform 0.35s var(--ease), color 0.3s; }
      .index a:hover .go { transform: translate(4px, -4px); color: var(--yellow); }

      /* writing + stack */
      .toc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
      .toc h3 { font: 600 0.74rem var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); border-top: 2px solid var(--text); padding-top: 12px; margin: 0 0 8px; }
      .toc ol { list-style: none; margin: 0; padding: 0; }
      .toc li { display: flex; align-items: baseline; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
      .toc .t { font-family: var(--serif); font-size: 1.14rem; line-height: 1.45; }
      .toc a.t:hover { color: var(--accent-text); }
      .toc .lead { flex: 1; border-bottom: 2px dotted var(--line-2); transform: translateY(-5px); min-width: 24px; }
      .toc .pg { font: 500 0.76rem var(--mono); color: var(--faint); white-space: nowrap; }
      .toc .soon .t { color: var(--muted); }
      .toc .soon .pg { color: var(--yellow-ink); }
      .all-posts { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; font: 600 0.82rem var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text);
        border-bottom: 2px solid var(--yellow); padding-bottom: 4px; transition: gap 0.3s var(--ease), color 0.2s; }
      .all-posts:hover { gap: 14px; color: var(--yellow-ink); }
      .stack-block { margin-top: 96px; display: grid; grid-template-columns: 220px 1fr; gap: 40px; }
      .stack-block .ch-num { align-self: start; }
      .stack-rows { display: grid; gap: 14px; }
      .srow { display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: start; }
      .srow .g { font-family: var(--mono); font-size: 0.74rem; color: var(--yellow-ink); padding-top: 7px; text-transform: uppercase; letter-spacing: 0.08em; }
      .srow .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .srow .chips span { font-size: 0.85rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); transition: border-color 0.2s, transform 0.2s; }
      .srow .chips span:hover { border-color: var(--hot); transform: translateY(-1px); }
      .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 30px; }

      .socials { display: flex; justify-content: center; gap: 10px; margin-top: 38px; }

        /* ---------- pipeline diagram ---------- */
        function pipeline(host, opts = {}) {
          const NS = "http://www.w3.org/2000/svg";
          const N = {
            event: [260, 52, 220, 56],
            checks: [260, 160, 220, 56],
            llm: [260, 268, 220, 56],
            gate: [260, 376, 220, 56],
            human: [92, 466, 172, 50],
            action: [260, 556, 220, 56],
            skip: [452, 160, 92, 40],
          };
          const label = { human: T.human, skip: T.skip };
          M.pipeline.forEach((p) => (label[p.id] = p[L]));
          const E = {
            e1: "M260 80 L260 132",
            e2: "M260 188 L260 240",
            eSkip: "M370 160 L406 160",
            e3: "M260 296 L260 348",
            eAuto: "M260 404 L260 528",
            eH1: "M150 376 C 104 376 92 390 92 441",
            eH2: "M92 491 C 92 530 112 556 150 556",
          };
          const ends = { e1: "checks", e2: "llm", eSkip: "skip", e3: "gate", eAuto: "action", eH1: "human", eH2: "action" };
          const order = ["event", "checks", "llm", "gate", "action"];
          let s = `<svg class="pipe" viewBox="0 0 520 600" aria-hidden="true">`;
          for (const [k, d] of Object.entries(E)) s += `<path class="edge" data-e="${k}" d="${d}"/>`;
          s += `<text class="elab" x="272" y="470">${esc(T.auto)}</text><text class="elab" x="106" y="424">${esc(T.review)}</text>`;
          for (const [id, [x, y, w, h]] of Object.entries(N)) {
            const r = id === "gate" ? 12 : h / 2;
            const i = order.indexOf(id);
            let inner;
            if (id === "skip") inner = `<text x="0" y="4" text-anchor="middle">${esc(label[id])}</text>`;
            else {
              const mark = id === "gate" ? `<path class="gem" d="M${-w / 2 + 24} -7 l7 7 -7 7 -7 -7z"/>` : `<circle class="dot" cx="${-w / 2 + 24}" cy="0" r="4"/>`;
              const num = i >= 0 ? `<text class="num" x="${-w / 2 - 12}" y="4" text-anchor="end">0${i + 1}</text>` : "";
              inner = `${mark}<text x="${-w / 2 + 42}" y="5">${esc(label[id])}</text>${num}`;
            }
            s += `<g class="node node-${id}" data-n="${id}" transform="translate(${x} ${y})"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${r}"/>${inner}</g>`;
          }
          s += `<g class="packets"></g></svg>`;
          host.innerHTML = s;
          const svg = host.querySelector("svg");
          // Shrink any node label that would spill out of its pill (long PT labels).
          const fitLabels = () =>
            svg.querySelectorAll(".node").forEach((g) => {
              const id = g.dataset.n;
              const w = N[id][2];
              const t = [...g.querySelectorAll("text")].find((x) => !x.classList.contains("num"));
              if (!t) return;
              t.style.fontSize = "";
              const room = id === "skip" ? w - 16 : w - 42 - 16;
              const len = t.getComputedTextLength();
              if (len > room) t.style.fontSize = parseFloat(getComputedStyle(t).fontSize) * (room / len) + "px";
            });
          fitLabels();
          document.fonts && document.fonts.ready.then(fitLabels);
          const pk = svg.querySelector(".packets");
          const paths = {};
          svg.querySelectorAll(".edge").forEach((p) => (paths[p.dataset.e] = { el: p, len: p.getTotalLength() }));
          const nodes = {};
          svg.querySelectorAll(".node").forEach((g) => (nodes[g.dataset.n] = g));
          const hit = (id) => {
            const g = nodes[id];
            g.classList.add("hit");
            clearTimeout(g._t);
            g._t = setTimeout(() => g.classList.remove("hit"), 420);
          };
          const routes = { skip: ["e1", "eSkip"], auto: ["e1", "e2", "e3", "eAuto"], review: ["e1", "e2", "e3", "eH1", "eH2"] };
          let packets = [];
          let running = false;
          let last = 0;
          let nextSpawn = 0;
          const logEl = opts.log;
          const stamp = () => new Date().toTimeString().slice(0, 8);
          function spawn() {
            const r = Math.random();
            const kind = r < 0.36 ? "skip" : r < 0.74 ? "auto" : "review";
            let wf = M.workflows[(Math.random() * M.workflows.length) | 0];
            if (wf === spawn.prev) wf = M.workflows[(M.workflows.indexOf(wf) + 1) % M.workflows.length];
            spawn.prev = wf;
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("r", 4.5);
            c.setAttribute("cx", 260);
            c.setAttribute("cy", 80);
            pk.appendChild(c);
            packets.push({ kind, wf, seg: 0, d: 0, el: c, wait: 0, speed: 170 + Math.random() * 50 });
            hit("event");
          }
          function done(p) {
            if (!logEl) return;
            const line = document.createElement("div");
            const verdict = p.kind === "skip" ? `${T.skip}` : p.kind === "auto" ? `gate → ${T.auto}` : `gate → ${T.review}`;
            line.innerHTML = `${stamp()}  <b style="font-weight:600;color:var(--text)">${p.wf.id.padEnd(3, " ")}</b>  <span class="nm">${esc(p.wf[L])}  </span><span class="k-${p.kind}">${esc(verdict)}</span>`;
            logEl.appendChild(line);
            while (logEl.children.length > 3) logEl.firstChild.remove();
          }
          function frame(t) {
            if (!running) return;
            const dt = Math.min(48, t - (last || t)) / 1000;
            last = t;
            if (t > nextSpawn) {
              spawn();
              nextSpawn = t + 620 + Math.random() * 760;
            }
            for (const p of packets) {
              const segs = routes[p.kind];
              if (p.wait > 0) {
                p.wait -= dt;
                continue;
              }
              p.d += p.speed * dt;
              const cur = paths[segs[p.seg]];
              if (p.d >= cur.len) {
                const end = ends[segs[p.seg]];
                hit(end);
                p.seg++;
                p.d = 0;
                if (end === "gate") p.wait = 0.28;
                if (p.seg >= segs.length) {
                  p.dead = true;
                  p.el.remove();
                  done(p);
                  continue;
                }
                p.el.setAttribute("class", "pkt s-" + segs[p.seg]);
              }
              const pt = paths[segs[p.seg]].el.getPointAtLength(p.d);
              p.el.setAttribute("cx", pt.x.toFixed(1));
              p.el.setAttribute("cy", pt.y.toFixed(1));
              if (!p.el.getAttribute("class")) p.el.setAttribute("class", "pkt s-" + segs[p.seg]);
            }
            packets = packets.filter((p) => !p.dead);
            requestAnimationFrame(frame);
          }
          let visible = false;
          const sync = () => {
            const should = visible && !document.hidden && !reduce;
            if (should && !running) {
              running = true;
              last = 0;
              requestAnimationFrame(frame);
            } else if (!should) running = false;
          };
          new IntersectionObserver(([e]) => {
            visible = e.isIntersecting;
            sync();
          }).observe(host);
          document.addEventListener("visibilitychange", sync);
          if (logEl) {
            [0, 6, 1].forEach((n, i) => done({ wf: M.workflows[n % M.workflows.length], kind: ["auto", "review", "skip"][i] }));
          }
          return {
            focus(ids) {
              svg.classList.toggle("focus", !!ids);
              Object.entries(nodes).forEach(([id, g]) => g.classList.toggle("on", !!ids && ids.includes(id)));
            },
          };
        }

        pipeline($("#heroPipe"), { log: $("#heroLog") });
        const story = pipeline($("#storyPipe"));

        /* ---------- principles scroll story ---------- */
        const stageMap = {
          deterministic: ["checks"],
          gates: ["gate", "human"],
          "ground-truth": ["llm"],
          evals: ["llm", "gate"],
          tracing: ["event", "action"],
          "less-context": ["llm"],
          dormant: ["action"],
        };
        const steps = $$(".step");
        const setStep = (i) => {
          steps.forEach((s, j) => s.classList.toggle("on", j === i));
          const p = C.principles[i];
          story.focus(stageMap[p.id]);
          $("#stageCount").textContent = `${String(i + 1).padStart(2, "0")} / ${String(C.principles.length).padStart(2, "0")}`;
          $("#stageLab").textContent = `${T.note} ${i + 1}`;
          $("#stageEv").textContent = p.evidence;
        };
        setStep(0);
        const stepIO = new IntersectionObserver(
          (entries) => entries.forEach((e) => e.isIntersecting && setStep(+e.target.dataset.i)),
          { rootMargin: "-48% 0px -48% 0px" }
        );
        steps.forEach((s) => stepIO.observe(s));

        /* ---------- reveal on view ---------- */
        const rvIO = new IntersectionObserver(
          (entries) =>
            entries.forEach((e) => {
              if (!e.isIntersecting) return;
              e.target.classList.add("in");
              rvIO.unobserve(e.target);
            }),
          { rootMargin: "0px 0px -8% 0px" }
        );
        $$(".rv").forEach((el) => rvIO.observe(el));
        const chainIO = new IntersectionObserver(([e]) => e.isIntersecting && (e.target.classList.add("in"), chainIO.disconnect()), { threshold: 0.6 });
        chainIO.observe($("#chain"));

        /* ---------- counters ---------- */
        const cntIO = new IntersectionObserver(
          (entries) =>
            entries.forEach((e) => {
              if (!e.isIntersecting) return;
              cntIO.unobserve(e.target);
              const el = e.target;
              const to = +el.dataset.to;
              if (reduce) return (el.textContent = to);
              const t0 = performance.now();
              const dur = 1500 + Math.min(to, 300) * 2;
              const tick = (t) => {
                const k = Math.min(1, (t - t0) / dur);
                el.textContent = Math.round(to * (1 - Math.pow(1 - k, 4)));
                if (k < 1) requestAnimationFrame(tick);
              };
              requestAnimationFrame(tick);
            }),
          { threshold: 0.6 }
        );
        $$(".cnt").forEach((el) => cntIO.observe(el));

        /* ---------- role scramble ---------- */
        // Scrambles each part inside its own fixed span, so wrapping never changes mid-effect.
        if (!reduce) {
          const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+/<>";
          const t0 = performance.now() + 350;
          const dur = 1300;
          const total = roleParts.reduce((n, [, t]) => n + t.length, 0);
          const tick = (t) => {
            const k = Math.max(0, Math.min(1, (t - t0) / dur));
            let n = Math.floor(k * total);
            roleParts.forEach(([el, target]) => {
              let out = "";
              for (let i = 0; i < target.length; i++) {
                const ch = target[i];
                out += n > 0 || ch === " " || ch === "-" || ch === "," ? ch : glyphs[(Math.random() * glyphs.length) | 0];
                n--;
              }
              el.textContent = out;
            });
            if (k < 1) requestAnimationFrame(tick);
            else roleParts.forEach(([el, target]) => (el.textContent = target));
          };
          requestAnimationFrame(tick);
        }

        /* ---------- pointer effects ---------- */
        if (finePointer && !reduce) {
          const hero = $(".hero");
          hero.addEventListener("pointermove", (e) => {
            const r = hero.getBoundingClientRect();
            hero.style.setProperty("--mx", `${e.clientX - r.left}px`);
            hero.style.setProperty("--my", `${e.clientY - r.top}px`);
          });
          $$(".mag").forEach((b) => {
            b.addEventListener("pointermove", (e) => {
              const r = b.getBoundingClientRect();
              b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * 0.22}px, ${(e.clientY - r.top - r.height / 2) * 0.32}px)`;
            });
            b.addEventListener("pointerleave", () => (b.style.transform = ""));
          });
          const bento = $("#bento");
          const tiles = $$(".tile", bento);
          bento.addEventListener("pointermove", (e) => {
            for (const t of tiles) {
              const r = t.getBoundingClientRect();
              t.style.setProperty("--x", `${e.clientX - r.left}px`);
              t.style.setProperty("--y", `${e.clientY - r.top}px`);
            }
          });
        }

        /* ---------- scroll-linked: header, timeline rail, nav spy ---------- */
        const header = $("header.top");
        const jSec = $("#journey");
        const track = $("#jnTrack");
        const jBar = $(".hs-bar span", jSec);
        const wide = matchMedia("(min-width: 1024px) and (min-height: 560px) and (pointer: fine)");
        let dist = 0;
        let pinned = false;
        const layoutJourney = () => {
          pinned = wide.matches && !reduce;
          jSec.classList.toggle("static", !pinned);
          if (!pinned) {
            jSec.style.height = "";
            track.style.transform = "";
            return;
          }
          dist = Math.max(0, track.scrollWidth - innerWidth);
          // Short pin: the track moves faster than the page scrolls.
          jSec.style.height = `${innerHeight + dist * 0.7}px`;
          onScroll();
        };
        const navLinks = $$("#nav a");
        const secs = navItems.map(([id]) => document.getElementById(id));
        let ticking = false;
        const onScroll = () => {
          ticking = false;
          header.classList.toggle("scrolled", scrollY > 8);
          const vh = innerHeight;
          if (pinned) {
            const r = jSec.getBoundingClientRect();
            const span = jSec.offsetHeight - (vh - 68);
            const p = Math.min(1, Math.max(0, (68 - r.top) / Math.max(1, span)));
            track.style.transform = `translate3d(${(-p * dist).toFixed(1)}px,0,0)`;
            jBar.style.transform = `scaleX(${p.toFixed(4)})`;
          }
          let cur = -1;
          secs.forEach((s, i) => s && s.getBoundingClientRect().top < vh * 0.4 && (cur = i));
          navLinks.forEach((a, i) => a.classList.toggle("on", i === cur));
        };
        addEventListener(
          "scroll",
          () => {
            if (!ticking) {
              ticking = true;
              requestAnimationFrame(onScroll);
            }
          },
          { passive: true }
        );
        addEventListener("resize", layoutJourney);
        wide.addEventListener?.("change", layoutJourney);
        document.fonts?.ready.then(layoutJourney);
        layoutJourney();
        onScroll();
      })();
    </script>
  </body>
</html>
