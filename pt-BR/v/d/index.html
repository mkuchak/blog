      .wf {
        all: unset; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 10px 10px; border-radius: 10px;
        background: var(--tile-2); border: 1px solid var(--line); font: 600 13px var(--mono); transition: border-color 0.2s, transform 0.2s;
      }
      .wf:hover, .wf.sel { border-color: var(--accent); }
      .wf:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
      .wf .hb { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: hb 2.4s infinite; animation-delay: var(--d, 0s); }
      .wf.reactive .hb { background: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation-name: hb2; }
      @keyframes hb { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
      @keyframes hb2 { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
      .wf-sel { margin-top: 16px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line-2); font: 13px var(--mono); color: var(--muted); min-height: 46px; display: flex; gap: 10px; align-items: center; }
      .wf-sel b { color: var(--text); }
      .wf-foot { margin-top: 14px; display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--faint); }
      .wf-foot b { color: var(--accent); font-size: 15px; }
      .wf-tile { display: flex; flex-direction: column; }
      .wf-tile .wf-foot { margin-top: auto; padding-top: 14px; }

      /* ---------- Pipeline ---------- */
      .pipe { display: flex; align-items: stretch; gap: 0; }
      .stage { flex: 1; min-width: 0; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--tile-2); transition: border-color 0.35s, background 0.35s, transform 0.35s; }
      .stage .n { font: 500 11px var(--mono); color: var(--faint); display: flex; justify-content: space-between; align-items: center; }
      .stage .n i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); transition: background 0.3s, box-shadow 0.3s; }
      .stage h4 { margin: 10px 0 6px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
      .stage p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
      .stage.on { border-color: color-mix(in srgb, var(--c) 70%, transparent); background: color-mix(in srgb, var(--c) 7%, var(--tile-2)); }
      .stage.on .n i { background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); }
      .conn { flex: 0 0 34px; position: relative; align-self: center; height: 2px; background: repeating-linear-gradient(90deg, var(--line-2) 0 4px, transparent 4px 8px); }
      .conn::after { content: ""; position: absolute; top: 50%; left: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); opacity: 0; }
      .conn.flow::after { animation: pk 0.75s cubic-bezier(0.5, 0, 0.5, 1); }
      @keyframes pk { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: 100%; opacity: 0; } }

      /* ---------- Cases ---------- */
      .case { display: flex; flex-direction: column; padding: 22px 22px 18px; }
      .svc { display: flex; align-items: center; gap: 4px 10px; font: 500 12px var(--mono); color: var(--faint); margin-bottom: 14px; flex-wrap: wrap; }
      .svc .name { color: var(--text); }
      .svc .org { flex-basis: 100%; margin-top: -4px; }
      .svc .state { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
      .state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
      .state.past .dot { background: var(--faint); }
      .case h3 { font-size: clamp(19px, 1.7vw, 23px); line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 10px; font-weight: 750; text-wrap: balance; }
      .case .sum { margin: 0 0 18px; color: var(--muted); font-size: 14.5px; text-wrap: pretty; }
      .case.big .sum { font-size: 15.5px; }
      .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-bottom: 16px; }
      .metric { padding: 12px 12px 10px; border-radius: 12px; background: var(--tile-2); border: 1px solid var(--line); }
      .metric b { display: block; font-size: 19px; letter-spacing: -0.02em; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
      .case.big .metric b { font-size: 24px; }
      .case.s4 .metric b { font-size: 17px; }
      .metric span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.3; }
      .acc-btn {
        all: unset; cursor: pointer; margin-top: auto; display: inline-flex; align-items: center; gap: 8px; font: 500 12.5px var(--mono); color: var(--muted);
        padding: 8px 0 2px; align-self: flex-start;
      }
      .acc-btn:hover { color: var(--text); }
      .acc-btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; border-radius: 6px; }
      .acc-btn .plus { width: 18px; height: 18px; border-radius: 6px; border: 1px solid var(--line-2); display: grid; place-items: center; transition: transform 0.3s; }
      .open > .acc-btn .plus, .open .acc-btn .plus { transform: rotate(45deg); }
      .acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .open .acc-body { grid-template-rows: 1fr; }
      .acc-body > div { overflow: hidden; min-height: 0; }
      .bul { list-style: none; padding: 14px 0 0; margin: 0; display: grid; gap: 9px; }
      .bul li { position: relative; padding-left: 20px; font-size: 14px; color: var(--muted); }
      .bul li::before { content: ""; position: absolute; left: 3px; top: 8px; width: 7px; height: 7px; border-radius: 2px; border: 1.5px solid var(--accent); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 14px; }
      .chip { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; border: 1px solid var(--line); background: var(--bg); color: var(--muted); white-space: nowrap; }

      /* ---------- Runbook ---------- */
      .rb-intro { position: sticky; top: 84px; align-self: start; }
      .rb-intro h2 { margin-bottom: 14px; }
      .rb-count { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; }
      .rb { padding: 0; overflow: hidden; }
      .rb-item + .rb-item { border-top: 1px solid var(--line); }
      .rb-btn { all: unset; cursor: pointer; display: grid; grid-template-columns: 62px 1fr 22px; gap: 12px; align-items: center; width: 100%; box-sizing: border-box; padding: 18px 22px; }
      .rb-btn:hover { background: color-mix(in srgb, var(--tile-2) 70%, transparent); }
      .rb-btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: -2px; }
      .rb-id { font: 500 12px var(--mono); color: var(--faint); }
      .rb-title { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
      .rb-btn .plus { width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--line-2); display: grid; place-items: center; font: 14px var(--mono); color: var(--muted); transition: transform 0.3s; }
      .rb-item.open .rb-btn .plus { transform: rotate(45deg); }
      .rb-item.open .rb-id { color: var(--accent); }
      .rb-body { padding: 0 22px 20px 96px; }
      .rb-body p { margin: 0 0 12px; font-family: var(--serif); color: var(--muted); font-size: 15.5px; max-width: 64ch; }
      .result { display: inline-flex; gap: 10px; align-items: baseline; font: 12.5px/1.5 var(--mono); padding: 9px 12px; border-radius: 10px; background: color-mix(in srgb, var(--ok) 9%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 28%, transparent); color: var(--text); }
      .result b { color: var(--ok); font-weight: 600; white-space: nowrap; }

      /* ---------- Journey (uptime) ---------- */
      .gantt { --label: 230px; }
      .axis { display: grid; grid-template-columns: var(--label) 1fr; gap: 16px; font: 11px var(--mono); color: var(--faint); margin-bottom: 6px; }
      .axis .ticks { position: relative; height: 18px; }
      .axis .ticks span { position: absolute; transform: translateX(-50%); }
      .rows { position: relative; }
      .row { all: unset; cursor: pointer; display: grid; grid-template-columns: var(--label) 1fr; gap: 16px; align-items: center; width: 100%; box-sizing: border-box; padding: 9px 0; border-top: 1px solid var(--line); }
      .row:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; border-radius: 8px; }
      .row .rl b { display: block; font-size: 14px; font-weight: 650; }
      .row .rl span { display: block; font-size: 12px; line-height: 1.35; color: var(--muted); text-wrap: balance; }
      .track { position: relative; height: 32px; border-radius: 8px; background: linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / calc(100% / var(--span, 17)) 100% repeat-x; }
      .bar {
        position: absolute; top: 4px; bottom: 4px; border-radius: 7px; background: color-mix(in srgb, var(--c) 22%, var(--tile-2)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
        display: flex; align-items: center; padding: 0 8px; font: 500 11px var(--mono); color: var(--text); overflow: hidden; white-space: nowrap; transition: filter 0.2s, transform 0.2s;
      }
      .bar.milestone { width: 16px !important; padding: 0; border-radius: 4px; transform: rotate(45deg) scale(0.75); top: 7px; bottom: auto; height: 16px; margin-left: -8px; background: var(--c); }
      .row:hover .bar:not(.milestone), .row.sel .bar:not(.milestone) { filter: brightness(1.08) saturate(1.2); }
      .row.sel .rl b { color: var(--accent); }
      .bar .yrs { opacity: 0.6; margin-left: 6px; }
      .bar.out { overflow: visible; }
      .bar.out .bl { position: absolute; top: 50%; transform: translateY(-50%); color: var(--text); white-space: nowrap; }
      .bar.out.to-left .bl { right: calc(100% + 10px); }
      .bar.out.to-right .bl { left: calc(100% + 10px); }
      .bar.current { background: linear-gradient(90deg, var(--purple), var(--blue)); border-color: transparent; color: #fff; animation: glowbar 2.4s ease-in-out infinite; }
      @keyframes glowbar { 50% { box-shadow: 0 0 18px color-mix(in srgb, var(--purple) 70%, transparent); } }
      .detail { margin-top: 16px; display: grid; grid-template-columns: var(--label) 1fr; gap: 16px; padding-top: 16px; border-top: 1px dashed var(--line-2); }
      .detail .meta { font: 12px/1.6 var(--mono); color: var(--faint); }
      .detail .meta b { display: block; color: var(--text); font: 600 15px var(--sans); }
      .detail p { margin: 0; font-family: var(--serif); font-size: 16px; color: var(--muted); max-width: 70ch; }

      /* ---------- Releases table ---------- */
      .tbl { width: 100%; border-collapse: collapse; }
      .tbl th { text-align: left; font: 500 11px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
      .tbl td { padding: 16px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
      .tbl tr:last-child td { border-bottom: 0; }
      .tbl tbody tr { transition: background 0.2s; }
      .tbl tbody tr:hover { background: color-mix(in srgb, var(--tile-2) 80%, transparent); }
      .pkg { font: 600 14px var(--mono); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
      .pkg::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
      .tbl .tl { font-weight: 600; font-size: 14.5px; }
      .tbl .dt { font-size: 13.5px; color: var(--muted); margin-top: 4px; max-width: 62ch; }
      .rel { font: 500 12.5px var(--mono); white-space: nowrap; }
      .tbl .tags { display: flex; gap: 6px; flex-wrap: wrap; }
      .go { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line); transition: background 0.2s, transform 0.2s; }
      tr:hover .go { background: var(--cta); color: #fff; border-color: transparent; transform: translate(2px, -2px); }

      /* ---------- Changelog + deps ---------- */
      .log { list-style: none; margin: 0; padding: 0; }
      .log li { display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; align-items: baseline; padding: 13px 0; border-top: 1px solid var(--line); }
      .log li:first-child { border-top: 0; }
      .log .when { font: 12px var(--mono); color: var(--faint); }
      .log .ttl { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
      .log .tg { font: 11.5px var(--mono); color: var(--faint); margin-top: 3px; }
      .log a.read { font: 500 12.5px var(--mono); color: var(--accent); white-space: nowrap; }
      .log a.read:hover { text-decoration: underline; }
      .log .queued { font: 500 11px var(--mono); color: var(--faint); border: 1px dashed var(--line-2); border-radius: 6px; padding: 2px 6px; }
      .log-h { font: 500 11px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 2px; }
      .log-h:first-child { margin-top: 0; }
      .deps { font: 12.5px var(--mono); }
      .dep + .dep { margin-top: 14px; }
      .dep .k { color: var(--accent); margin-bottom: 8px; }
      .dep .k span { color: var(--faint); }
      .env { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line-2); display: grid; gap: 6px; font: 12.5px var(--mono); }
      .env div { display: grid; grid-template-columns: 112px 1fr; gap: 10px; }
      .env .k { color: var(--faint); }

      /* ---------- Contact ---------- */
      .contact { padding: 40px; overflow: hidden; }
      .contact::after {
        content: ""; position: absolute; inset: auto -10% -60% 30%; height: 120%; z-index: -1; pointer-events: none;
        background: radial-gradient(closest-side, color-mix(in srgb, var(--purple) 22%, transparent), transparent);
      }
      .ticket { display: flex; gap: 10px; align-items: center; font: 500 12px var(--mono); color: var(--faint); margin-bottom: 18px; flex-wrap: wrap; }
      .contact h2 { font-size: clamp(30px, 4.4vw, 54px); letter-spacing: -0.04em; max-width: 16ch; }
      .contact .sub2 { font-family: var(--serif); color: var(--muted); font-size: 18px; max-width: 54ch; margin: 14px 0 28px; }
      .socials { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
      .soc { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 13.5px; font-weight: 500; transition: border-color 0.2s, transform 0.2s; }
      .soc:hover { border-color: var(--accent); transform: translateY(-2px); }
      .soc svg { width: 15px; height: 15px; fill: currentColor; }
      footer { margin-top: 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--faint); }
      footer b { color: var(--text); }

      /* ---------- Reveal ---------- */
      html.anim .rv { opacity: 0; transform: translateY(14px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); transition-delay: calc(var(--i, 0) * 60ms); }
      html.anim .rv.in { opacity: 1; transform: none; }

      /* ---------- Responsive ---------- */
      @media (max-width: 1180px) {
        .nav { display: none; }
        .top-actions { margin-left: auto; }
        .s8.hero-tile, .s4.trace-tile { grid-column: span 12; }
        .kpi.s2 { grid-column: span 4; }
        .s7.thesis-tile, .s5.wf-tile { grid-column: span 6; }
        .case.s4 { grid-column: span 6; }
        .case.s4:last-of-type { grid-column: span 12; }
        .feed { min-height: 300px; }
      }
      @media (max-width: 960px) {
        .pipe { flex-direction: column; }
        .conn { flex: 0 0 22px; width: 2px; height: auto; align-self: flex-start; margin-left: 24px; background: repeating-linear-gradient(180deg, var(--line-2) 0 4px, transparent 4px 8px); }
        .conn::after { left: 50%; top: 0; margin: -4px 0 0 -4px; }
        .conn.flow::after { animation-name: pkv; }
        @keyframes pkv { 0% { top: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .s7.thesis-tile, .s5.wf-tile, .case.s7, .case.s5, .case.s4, .s6, .s7, .s5 { grid-column: span 12; }
        .rb-intro { position: static; }
        .rb-wrap > * { grid-column: span 12; }
      }
      @media (max-width: 720px) {
        .wrap { width: calc(100% - 24px); }
        .grid { gap: 10px; }
        .top .wrap { gap: 10px; height: 58px; }
        .brand small, .top-actions .gh { display: none; }
        .top .prefs { --kc-h: 32px; gap: 4px; }
        .top .prefs button { padding: 0 6px; }
        .pill .txt { display: none; }
        .pill { padding: 0 9px; }
        .kpi.s2 { grid-column: span 6; }
        .kpi { min-height: 150px; padding: 14px 14px 12px; }
        .hero { padding: 24px 20px 22px; }
        .hero p.sub { font-size: 16.5px; }
        .role { flex-direction: column; }
        .role em { display: none; }
        .tile { padding: 18px; }
        .contact { padding: 26px 20px; }
        .sec { margin-top: 56px; }
        .gantt { --label: 1fr; }
        .axis { grid-template-columns: 1fr; }
        .axis .lbl { display: none; }
        .row { grid-template-columns: 1fr; gap: 6px; }
        .bar .yrs { display: none; }
        .detail { grid-template-columns: 1fr; gap: 8px; }
        .rb-btn { grid-template-columns: 46px 1fr 22px; padding: 16px 18px; gap: 8px; }
        .rb-title { font-size: 15.5px; }
        .rb-body { padding: 0 18px 18px 18px; }
        .tbl thead { display: none; }
        .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
        .tbl tr { position: relative; padding: 14px 0; border-bottom: 1px solid var(--line); }
        .tbl tr:last-child { border-bottom: 0; }
        .tbl td { padding: 3px 44px 3px 0; border: 0; }
        .tbl td.lnk { position: absolute; right: 0; top: 14px; padding: 0; width: auto; }
        .log li { grid-template-columns: 1fr auto; }
        .log .when { grid-column: 1 / -1; }
        .inc { font-size: 10.5px; }
        .trace-cols, .ev { grid-template-columns: 56px 34px 1fr; gap: 8px; }
        .ev { padding: 7px 14px; font-size: 11.5px; }
        .trace-cols { padding: 0 14px 8px; }
        .now { margin-left: 0; }
      }
      @media (max-width: 1480px) {
        .top-actions .gh, .brand small { display: none; }
      }
      @media (max-width: 1320px) and (min-width: 1181px) {
        #status .txt { display: none; }
        #status { padding: 0 9px; }
      }
      @media (max-width: 440px) {
        #status { display: none; }
        .top-actions { margin-left: auto; gap: 6px; }
        .top .btn-sm.solid { padding: 0 12px; }
      }
      @media (max-width: 340px) {
        .kpi.s2 { grid-column: span 12; min-height: 0; }
      }
      @media (max-width: 400px) {
        .kpi .val { font-size: 30px; }
        .ctas .btn { width: 100%; justify-content: center; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="bg" aria-hidden="true"></div>

    <header class="top">
      <div class="wrap">
        <a class="brand" href="#top" aria-label="Kuchak, home">Kuchak <small>kuch.dev</small></a>
        <span class="pill" id="status"><span class="pulse" aria-hidden="true"></span><span class="txt"></span></span>
        <nav class="nav" id="nav" aria-label="Sections"></nav>
        <div class="top-actions" id="topActions"></div>
      </div>
    </header>

    <main id="main" class="wrap">
      <!-- Overview -->
      <section id="top" class="grid" aria-label="Overview">
        <div class="tile glow hero-tile s8 hero" id="hero"></div>
        <div class="tile trace-tile s4 trace" id="trace"></div>
        <div class="kpi-note" id="kpiNote"></div>
        <div id="kpis" style="display: contents"></div>
        <div class="tile s12 rv" id="pipeline"></div>
        <div class="tile thesis-tile s7 thesis rv" id="thesis"></div>
        <div class="tile wf-tile s5 rv" id="workflows"></div>
      </section>

      <section id="work" class="sec">
        <div class="sec-head" id="workHead"></div>
        <div class="grid" id="cases"></div>
      </section>

      <section id="principles" class="sec">
        <div class="grid rb-wrap">
          <div class="s4 rb-intro" id="rbIntro"></div>
          <div class="tile s8 rb rv" id="runbook"></div>
        </div>
      </section>

      <section id="journey" class="sec">
        <div class="sec-head" id="journeyHead"></div>
        <div class="tile gantt rv" id="gantt"></div>
      </section>

      <section id="oss" class="sec">
        <div class="sec-head" id="ossHead"></div>
        <div class="tile rv" style="padding: 18px 10px 6px"><table class="tbl" id="releases"></table></div>
      </section>

      <section id="writing" class="sec">
        <div class="grid">
          <div class="tile s7 rv" id="changelog"></div>
          <div class="tile s5 rv" id="deps"></div>
        </div>
      </section>

      <section id="contact" class="sec">
        <div class="tile contact rv" id="contactTile"></div>
        <footer id="foot"></footer>
      </section>
    </main>

    <script>
      (function () {
        const c = KUCH.content();
        const m = KUCH.meta;
        const lang = KUCH.lang;
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce) document.documentElement.classList.add("anim");

        // Small UI labels that content.js doesn't carry.
        const L = {
          en: {

        $("#ossHead").innerHTML = `<div><div class="kicker">${esc(c.ossIntro.kicker)}</div><h2>${esc(c.ossIntro.title)}</h2></div><p class="sec-sub">${esc(c.ossIntro.sub)}</p>`;
        $("#releases").innerHTML = `
          <thead><tr><th>${L.pkg}</th><th>${L.what}</th><th>${L.releases}</th><th>${L.tags}</th><th><span class="sr" style="position:absolute;left:-9999px">link</span></th></tr></thead>
          <tbody>${c.oss
            .map((o) => `<tr>
              <td><a class="pkg" href="${o.url}" target="_blank" rel="noreferrer">${esc(o.name)}</a></td>
              <td><div class="tl">${esc(o.tagline)}</div><div class="dt">${esc(o.detail)}</div></td>
              <td><span class="rel">${esc(o.stat)}</span></td>
              <td><div class="tags">${o.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div></td>
              <td class="lnk"><a class="go" href="${o.url}" target="_blank" rel="noreferrer" aria-label="${esc(o.name)} on GitHub">${ARROW_UR}</a></td>
            </tr>`)
            .join("")}</tbody>`;

        // ---------- Changelog + deps ----------
        const pub = c.writing.filter((w) => w.published);
        const up = c.writing.filter((w) => !w.published);
        const entry = (w) => `<li><span class="when">${w.published ? esc(w.date) : `<span class="queued">${L.queued}</span>`}</span>
          <div><div class="ttl">${esc(w.title)}</div><div class="tg">${w.tags.map((t) => "#" + esc(t)).join(" ")}</div></div>
          ${w.published ? `<a class="read" href="${w.url}" target="_blank" rel="noreferrer">${esc(c.writingIntro.read)} →</a>` : "<span></span>"}</li>`;
        $("#changelog").innerHTML = `
          <div class="t-head"><span>${L.changelog}</span><span class="grow"></span><a class="tag" href="${m.links.blog}" target="_blank" rel="noreferrer">${esc(c.ui.viewAll)} ↗</a></div>
          <div class="kicker">${esc(c.writingIntro.kicker)}</div>
          <h2 style="margin-bottom:6px">${esc(c.writingIntro.title)}</h2>
          <p class="sec-sub" style="margin-bottom:18px">${esc(c.writingIntro.sub)}</p>
          <div class="log-h">${esc(c.writingIntro.upcoming)}</div><ul class="log">${up.map(entry).join("")}</ul>
          <div class="log-h">${esc(c.writingIntro.published)}</div><ul class="log">${pub.map(entry).join("")}</ul>`;
        $("#deps").innerHTML = `
          <div class="t-head"><span>package.json · ${L.deps}</span></div>
          <div class="kicker">${esc(c.stackIntro.kicker)}</div>
          <h2 style="margin-bottom:18px">${esc(c.stackIntro.title)}</h2>
          <div class="deps">${c.stack
            .map((g) => `<div class="dep"><div class="k">"${esc(g.group.toLowerCase())}"<span>: [${g.items.length}]</span></div><div class="chips" style="padding-top:0">${g.items.map((it) => `<span class="chip">${esc(it)}</span>`).join("")}</div></div>`)
            .join("")}</div>
          <div class="env">
            <div><span class="k">${L.education}</span><span>${esc(c.about.education)}</span></div>
            <div><span class="k">${L.languages}</span><span>${esc(c.about.languages)}</span></div>
            <div><span class="k">${L.based}</span><span>${esc(c.about.based)}</span></div>
          </div>`;

        // ---------- Contact ----------
        const icons = {
          github: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17 4.7 18 5 18 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>',
          linkedin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 20.5h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.3V9h3.4v1.6c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5v6.2ZM5.3 7.4a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2ZM7.1 20.5H3.5V9h3.6v11.5ZM22.2 0H1.8C.8 0 0 .8 0 1.7v20.6c0 .9.8 1.7 1.8 1.7h20.4c1 0 1.8-.8 1.8-1.7V1.7C24 .8 23.2 0 22.2 0Z"/></svg>',
          x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 1.2h3.7l-8 9.2 9.4 12.4h-7.4l-5.8-7.6-6.6 7.6H.5l8.6-9.8L0 1.2h7.6l5.2 6.9 6.1-6.9Zm-1.3 19.5h2L6.5 3.2H4.3l13.3 17.5Z"/></svg>',
          instagram: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2ZM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0Zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4ZM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9Z"/></svg>',
        };
        $("#contactTile").innerHTML = `
          <div class="ticket"><span class="tag">${L.ticket}</span><span class="tag" style="color:var(--ok)">● ${L.newT}</span><span>${esc(c.contact.kicker)}</span></div>
          <h2>${esc(c.contact.title)}</h2>
          <p class="sub2">${esc(c.contact.sub)}</p>
          <div class="ctas">
            <a class="btn solid" href="mailto:${m.email}">${esc(c.contact.cta)} <span class="arr">${ARROW}</span></a>
            <button class="btn" id="copyBtn" type="button">${esc(c.ui.copy)}</button>
            <a class="btn" href="${m.links.resume}" target="_blank" rel="noreferrer">${esc(c.contact.resume)} ${ARROW_UR}</a>
          </div>
          <div class="socials">${["github", "linkedin", "x", "instagram"]
            .map((k) => `<a class="soc" href="${m.links[k]}" target="_blank" rel="noreferrer">${icons[k]}${k === "x" ? "X" : k[0].toUpperCase() + k.slice(1).replace("hub", "Hub").replace("edin", "edIn")}</a>`)
            .join("")}</div>`;
        $("#copyBtn").addEventListener("click", async (e) => {
          const b = e.currentTarget;
          try { await navigator.clipboard.writeText(m.email); } catch (_) {}
          b.textContent = c.ui.copied + " ✓";
          setTimeout(() => (b.textContent = c.ui.copy), 1600);
        });
        $("#foot").innerHTML = `<span>© ${new Date().getFullYear()} <b>${esc(m.domain)}</b>. ${esc(c.contact.footer)}</span><a href="#top">${esc(c.ui.backToTop)} ↑</a>`;

        // ---------- Cursor spotlight ----------
        if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
          document.addEventListener("pointermove", (e) => {
            const t = e.target.closest && e.target.closest(".tile");
            if (!t) return;
            const r = t.getBoundingClientRect();
            t.style.setProperty("--x", e.clientX - r.left + "px");
            t.style.setProperty("--y", e.clientY - r.top + "px");
          }, { passive: true });
        }

        // ---------- Reveal ----------
        if (!reduce) {
          const rvIO = new IntersectionObserver((ents) => ents.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); rvIO.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
          document.querySelectorAll(".rv").forEach((el) => rvIO.observe(el));
        }
      })();
    </script>
  </body>
</html>
